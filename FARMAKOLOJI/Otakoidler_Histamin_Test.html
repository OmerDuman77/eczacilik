"Tromboksan"], "a": 3, "e": "Otakoidler üç sınıftır: biyojenik aminler (histamin, serotonin), fosfolipid türevleri/eikozanoidler (prostaglandin, tromboksan, lökotrien, TAF) ve polipeptidler (anjiyotensin, kininler: bradikinin, kallidin)."}, {"q": "Histamin vücutta hangi reaksiyonla sentezlenir?", "o": ["Tirozinin tirozin hidroksilaz ile hidroksilasyonu", "Triptofanın hidroksilasyonu ve dekarboksilasyonu", "Araşidonik asidin siklooksijenaz ile oksidasyonu", "Glutamatın glutamat dekarboksilaz ile dekarboksilasyonu", "Histidinin histidin dekarboksilaz (HDC) ile dekarboksilasyonu"], "a": 4, "e": "Histamin, belirli hücrelerde histidin aminoasidinin histidin dekarboksilaz enzimiyle CO₂ kaybetmesi (dekarboksilasyon) sonucu oluşur. Triptofandan serotonin, tirozinden katekolaminler oluşur."}, {"q": "Histaminin kimyasal yapısı aşağıdakilerden hangisidir?", "o": ["Katekolamin", "İndoletilamin", "İmidazoletilamin", "5-hidroksitriptamin", "Fenilalkilamin"], "a": 2, "e": "Histamin bir imidazol halkası ve etilamin zinciri taşıyan β-imidazoletilamindir. 5-hidroksitriptamin serotonindir."}, {"q": "Mast hücrelerinde histamin nasıl depolanır?", "o": ["Lizozomlarda serotonin ile birlikte", "Granüllerde heparin ile kompleks halinde", "Hücre çekirdeğinde DNA'ya bağlı olarak", "Mitokondri içinde ATP'ye bağlı olarak", "Sitoplazmada serbest halde"], "a": 1, "e": "Mast hücreleri ve bazofillerde histamin, heparin açısından zengin granüllerde heparin ile kompleks halinde depolanır."}, {"q": "Mast hücrelerinin kandaki serbest analoğu hangisidir?", "o": ["Monositler", "Nötrofiller", "Eozinofiller", "Lenfositler", "Bazofil lökositler"], "a": 4, "e": "Mast hücreleri dokuda, onların kandaki karşılığı olan bazofiller ise dolaşımda bulunur; her ikisi de histamin-heparin içeren granüllere sahiptir."}, {"q": "Histaminin mast hücresi dışı hücrelerde (histaminosit) bulunduğu yerler hangisinde doğru verilmiştir?", "o": ["Deri, akciğer ve plasenta", "Karaciğer ve dalak", "İskelet kası ve kalp kası", "Beyin, epidermis ve gastrik mukoza", "Kemik iliği ve lenf nodları"], "a": 3, "e": "Deri, barsak mukozası, akciğer, karaciğer ve plasentada histamin mast hücrelerindedir. Beyin, epidermis ve gastrik mukozada ise mast hücresi olmayan hücrelerde (histaminosit) bulunur."}, {"q": "Mast hücresi yüzeyinde reseptörü bulunan ve immünolojik histamin salıverilmesinde rol oynayan antikor hangisidir?", "o": ["IgD", "IgA", "IgM", "IgE", "IgG"], "a": 3, "e": "Mast hücrelerinin yüzeyinde IgE reseptörleri (FcεRI) vardır. Antijenin hücreye bağlı IgE'leri çapraz bağlaması degranülasyona ve histamin salıverilmesine yol açar."}, {"q": "Aşağıdaki ilaçlardan hangisi kimyasal yolla mast hücresinden histamin salıverilmesine neden olur?", "o": ["Disodyum kromoglikat", "Salbutamol", "Morfin", "Famotidin", "Ketotifen"], "a": 2, "e": "Morfin, tübokurarin, polimiksin B, dekstran, hidralazin, safra tuzları gibi maddeler kimyasal yolla histamin salıverir. Beta agonistler (salbutamol) ve mast hücre stabilizatörleri (kromoglikat, ketotifen) ise salıverilmeyi azaltır."}, {"q": "Histamin salıverilmesini azaltan ilaç grupları hangisinde birlikte verilmiştir?", "o": ["Safra tuzları ve deterjanlar", "Polimiksin B ve dekstran", "H2 reseptör blokörleri ve proton pompası inhibitörleri", "Beta agonistler ve mast hücre stabilizatörleri", "Opioidler ve kas gevşeticiler"], "a": 3, "e": "Slaytta histamin salıverilmesini azaltan ilaçlar beta agonistler ve mast hücre stabilizatörleri olarak verilmiştir. Diğer seçeneklerdeki maddelerin çoğu tersine histamin salıverir."}, {"q": "Yemekten sonra fizyolojik mide asit salgısında histamini salıveren hücreler hangileridir?", "o": ["Esas (chief) hücreler", "G hücreleri", "D hücreleri", "Pariyetal hücreler", "Enterokromafin benzeri (ECL) hücreler"], "a": 4, "e": "G hücrelerinden gastrin, enterik nöronlardan ACh salınır; bunlar ECL hücrelerinden histamin salıverir. Histamin de pariyetal hücrelerdeki H2 reseptörleri üzerinden asit salgısını uyarır. D hücreleri somatostatin salgılar."}, {"q": "Histamin pariyetal hücrelerde asit salgısını hangi reseptör aracılığıyla artırır?", "o": ["H4", "H2", "Muskarinik M1", "H3", "H1"], "a": 1, "e": "Mide asit salgı bezi hücrelerinde H2 reseptörleri bulunur. Bu yüzden H2 blokörleri asit salgısını azaltırken H1 blokörleri mide asidine dokunmaz."}, {"q": "Histaminin yaklaşık yarısı hangi yolla metabolize edilir?", "o": ["Monoamin oksidaz ile deaminasyon", "Glukuronik asitle konjugasyon", "Katekol-O-metiltransferaz ile metilasyon", "Histamin N-metiltransferaz ile N-metilasyon", "Diamin oksidaz ile oksidatif deaminasyon"], "a": 3, "e": "Histaminin yaklaşık yarısı N-metilasyon, üçte biri diamin oksidaz (histaminaz) ile oksidatif deaminasyonla metabolize edilir; az bir kısmı değişmeden idrarla atılır."}, {"q": "Klasik antihistaminiklerle bloke edilen histamin reseptörü hangisidir?", "o": ["H1", "H4", "Hepsi eşit derecede", "H2", "H3"], "a": 0, "e": "Klasik antihistaminikler (1930'lardan beri kullanılan) H1 reseptör blokörleridir. H1 blokörleriyle bazı etkilerin engellenememesi H2 reseptörlerinin keşfine yol açmıştır."}, {"q": "Histaminin genel farmakolojik etkileri hangisinde doğru özetlenmiştir?", "o": ["Yalnızca kalp kasını etkiler", "Tüm düz kasları büzer ve salgıları azaltır", "Tüm düz kasları gevşetir ve salgıları azaltır", "Damar düz kaslarını büzer, damar dışı düz kasları gevşetir, dış salgı bezlerini inhibe eder", "Damar düz kaslarını gevşetir, damar dışı düz kasları büzer, dış salgı bezlerini uyarır"], "a": 4, "e": "Histamin damar düz kasını gevşetir (vazodilatasyon), bronş, barsak, uterus gibi damar dışı düz kasları büzer ve mide, tükürük, gözyaşı, bronş gibi dış salgı bezlerini uyarır."}, {"q": "H1 reseptörü aracılı vazodilatasyon hangi mediatörlerle gerçekleşir?", "o": ["Katekolaminler", "Asetilkolin", "Lökotrienler ve tromboksan", "NO ve prostasiklin (PGI₂)", "Prostaglandinler (H2 aracılı)"], "a": 3, "e": "Vazodilatasyon hem H1 hem H2 ile olur: H1 aracılı vazodilatasyon NO ve PGI₂ ile, H2 aracılı vazodilatasyon prostaglandinler aracılığıyla gerçekleşir. Sonuçta kan basıncı düşer."}, {"q": "Histaminin kapiller permeabiliteyi artırma mekanizması hangisidir?", "o": ["Endotel hücrelerinin şişerek aralıkların kapanması", "Damar düz kasının kasılması", "H2 reseptörleri aracılığıyla bazal membranın yıkılması", "Lenfatik drenajın artması", "H1 reseptörleri aracılığıyla endotel hücrelerinin büzülüp hücreler arası aralıkların genişlemesi"], "a": 4, "e": "H1 aracılı olarak endotel hücreleri büzülür, aralıklar genişler; plazma suyu ve proteinleri ekstrasellüler alana kaçar (ödem), lökositler dokuya göç eder (inflamasyon)."}, {"q": "Histaminin kalp hızı üzerindeki belirgin etkisinin nedeni hangisidir?", "o": ["Adrenal medullanın inhibisyonu", "Kalp kasında kalsiyum kanallarının blokajı", "Kan basıncının düşmesine bağlı baroreseptör refleksle oluşan refleks taşikardi", "SA düğümde H3 reseptörlerinin doğrudan uyarılması", "Vagal tonusun artması"], "a": 2, "e": "Histamin vazodilatasyonla kan basıncını düşürür; baroreseptör refleks mekanizmasıyla refleks taşikardi oluşur."}, {"q": "“Histamin şoku” gelişiminde aşağıdakilerden hangisi görülmez?", "o": ["Kapiller permeabilitenin artması", "Kanın ekstrasellüler aralığa geçmesi", "Venöz dönüşün azalması", "Dolaşan kan hacminin ve kardiyak çıkışın artması", "Kan basıncının hızla düşmesi"], "a": 3, "e": "Yüksek doz veya anafilakside açığa çıkan histamin kan basıncını hızla düşürür, permeabilite artışıyla kan ekstrasellüler alana geçer; dolaşan kan hacmi, venöz dönüş ve kardiyak çıkış azalır → hipotansif şok."}, {"q": "Lewis'in üçlü cevabı hangisinde doğru eşleştirilmiştir?", "o": ["Vazokonstriksiyon → solukluk; permeabilite azalması → kuruluk; ağrı → kaşıntı", "Bronkokonstriksiyon → hırıltı; asit salgısı → yanma; ödem → şişlik", "Vazodilatasyon → ödem; permeabilite artışı → hale; sinir uyarımı → kızarıklık", "Vazodilatasyon → kızarıklık; permeabilite artışı → ödem papülü; aferent sinir uyarımı → hale şeklinde kızarıklık", "Taşikardi → çarpıntı; hipotansiyon → baş dönmesi; ödem → papül"], "a": 3, "e": "Cilt içine düşük doz histamin: (1) vazodilatasyonla kırmızı nokta/kızarıklık, (2) kapiller permeabilite artışıyla ödem papülü (wheal), (3) aferent sinir uçlarının uyarılmasıyla P maddesi aracılı vazodilatasyon sonucu hale (flare)."}, {"q": "Histaminin zonklayıcı tipte baş ağrısı yapmasının nedeni hangisidir?", "o": ["Beyin ve meninks damarlarında vazodilatasyon ve BOS salgı artışı", "Serebral damarlarda vazokonstriksiyon", "Histaminin KBB'yi geçip nöronları uyarması", "Kan basıncının aşırı yükselmesi", "Hipoglisemi"], "a": 0, "e": "Histamin beyin ve meninks damarlarını genişletir; ayrıca BOS salgı artışı kafa içi basıncını yükseltir. Sonuç zonklayıcı tip baş ağrısıdır."}, {"q": "Trakeobronşiyal düz kaslarda histaminin egemen etkisi ve aracı reseptörü hangisidir?", "o": ["H1 aracılı bronkokonstriksiyon", "H3 aracılı bronkokonstriksiyon", "H2 aracılı bronkodilatasyon", "H1 aracılı bronkodilatasyon", "H2 aracılı bronkokonstriksiyon"], "a": 0, "e": "H1 reseptörleri bronkokonstriksiyon (PGF₂α, TXA₂ aracılı), H2 reseptörleri bronkodilatasyon yapar. H1/H2 oranı önemlidir; egemen etki bronkokonstriksiyondur."}, {"q": "H3 reseptörleri esas olarak nerede bulunur?", "o": ["SSS'de akson uçlarında (presinaptik)", "Mide pariyetal hücrelerinde", "Damar endotelinde", "Mast hücre yüzeyinde", "Bronş düz kasında"], "a": 0, "e": "Slayta göre H3 reseptörleri SSS'de akson uçlarında yer alır. Kolinerjik uçlardan ACh salınımını etkileyerek bronşlarda da rol oynar."}, {"q": "Histamin ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Tükürük, gözyaşı ve pankreas dış salgısını artırır", "Cilt içine enjeksiyonu yanma ve kaşıntı yapar", "Cilt altına enjeksiyonu ağrı yapar", "Nötrofillerin dokuya migrasyonunu tetikler", "Kan-beyin bariyerini kolayca geçerek merkezi etkiler oluşturur"], "a": 4, "e": "Histamin KBB'yi geçemez; ancak doğrudan SSS'ye uygulandığında hipotermi, susama, antidiürez, kusma ve sempatik hiperaktivite yapar."}, {"q": "0,1–0,2 mg histamin i.v. uygulandığında kan basıncı düşmüyor, hatta artıyorsa hangi tanı düşünülür?", "o": ["Karsinoid sendrom", "Pernisyöz anemi", "Zollinger-Ellison sendromu", "Aklorhidri", "Feokromositoma"], "a": 4, "e": "Histamin adrenal medulladan katekolamin salıverir. Feokromositomada tümörden aşırı katekolamin salınımı histaminin hipotansif etkisini maskeler; kan basıncı düşmez, hatta yükselir."}, {"q": "Aklorhidri teşhis testinde s.c. histamine rağmen asit salgılanmaması aşağıdakilerden hangisinde görülebilir?", "o": ["Duodenum ülseri", "Pernisyöz anemi", "Gastroözofageal reflü", "Feokromositoma", "Zollinger-Ellison sendromu"], "a": 1, "e": "Aklorhidri testinde açken s.c. 0,5–1 mg histamin verilir. Asit salgılanmaması aklorhidriyi gösterir; pernisyöz anemi, atrofik gastrit ve mide kanserinde görülebilir. Zollinger-Ellison'da tersine aşırı asit vardır."}, {"q": "Meniere hastalığının tedavisinde kullanılan histamin preparatı hangisidir?", "o": ["Disodyum kromoglikat", "Betahistin (beta histidin)", "Simetidin", "Betazol", "Histamin fosfat"], "a": 1, "e": "Betahistin Meniere hastalığında (baş dönmesi, çınlama, işitme kaybı) kullanılır. Betazol ise yan etkisi az olan, aklorhidri teşhisinde kullanılan histamin analoğudur."}, {"q": "H1 ve H2 reseptör blokörleri histamine karşı nasıl bir antagonizma oluşturur?", "o": ["Kompetitif (yarışmalı) antagonizma", "Kimyasal antagonizma", "Farmakokinetik antagonizma", "Nonkompetitif irreversibl antagonizma", "Fizyolojik antagonizma"], "a": 0, "e": "H reseptör blokörleri reseptöre bağlanmak için histaminle yarışır; kompetitif blokaj yaparlar. Adrenalin ise anafilakside histamine karşı fizyolojik antagonisttir."}, {"q": "Aşağıdaki H1 blokörlerinden hangisi güçlü sedasyon yapan etanolamin türevidir?", "o": ["Meklizin", "Difenhidramin", "Setirizin", "Deksklorfeniramin", "Loratadin"], "a": 1, "e": "Etanolaminler (difenhidramin, dimenhidrinat) ve etilendiaminler (antazolin, mepiramin) güçlü sedasyon yapar. Alkilaminler zayıf sedatif, piperidinler çok az veya hiç sedatif değildir."}, {"q": "Kan-beyin bariyerini geçmediği için çok az ya da hiç sedasyon yapmayan H1 blokörü hangisidir?", "o": ["Mepiramin", "Loratadin", "Prometazin", "Dimenhidrinat", "Difenhidramin"], "a": 1, "e": "Piperidin türevleri (terfenadin, loratadin, setirizin, astemizol) KBB'yi geçmez ve çok az veya hiç sedasyon yapmaz. Diğer H1 blokörleri KBB'yi kolayca aşar."}, {"q": "Antiemetik ve zayıf sedatif etkileriyle bilinen piperazin türevi H1 blokörü hangisidir?", "o": ["Mepiramin", "Meklizin", "Antazolin", "Loratadin", "Deksklorfeniramin"], "a": 1, "e": "Piperazinler (buklizin, meklizin, sinarizin) antiemetik ve zayıf sedatif etkilidir; hareket hastalığında kullanılır."}, {"q": "H1 reseptör blokörlerinin farmakokinetiği için aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Plazma proteinlerine yüksek oranda bağlanırlar", "İlk geçiş eliminasyonuna uğrarlar", "Piperidinler dahil hepsi kan-beyin bariyerini kolayca geçer", "Lipofilik bileşiklerdir ve GİS'ten iyi absorbe edilirler", "Karaciğerde metabolize edilirler"], "a": 2, "e": "H1 blokörleri lipofiliktir, iyi absorbe edilir, ilk geçişe uğrar, proteine çok bağlanır, oral alımdan 2–3 saat sonra doruk yapar ve karaciğerde metabolize olur. Piperidinler hariç KBB'yi kolay geçerler."}, {"q": "İnsanlarda alerjik bronkospazmdan histamine göre daha çok sorumlu olan mediatörler hangileridir?", "o": ["PAF (trombosit aktive edici faktör) ve lökotrienler", "Gastrin ve sekretin", "Serotonin ve dopamin", "Bradikinin ve kallidin", "Prostasiklin ve NO"], "a": 0, "e": "H1 blokörleri histaminin yaptığı bronkokonstriksiyonu antagonize eder; ancak insanda alerjik bronkospazmda asıl rol PAF ve lökotrienlerindir. Bu yüzden antihistaminiklerin astım krizinde terapötik değeri yoktur."}, {"q": "H1 blokörlerinin tükürük, gözyaşı ve diğer ekzokrin salgıları azaltmasından esas olarak hangi etki sorumludur?", "o": ["Serotonin blokajı", "H1 reseptör blokajı", "Antikolinerjik (parasempatolitik) etki", "H2 reseptör blokajı", "α-adrenerjik blokaj"], "a": 2, "e": "Ekzokrin salgıların azalmasında H1 blokajından çok antikolinerjik etki sorumludur; ağız kuruluğu, idrar retansiyonu, kabızlık gibi yan etkiler de buna bağlıdır."}, {"q": "α-adrenerjik reseptör blokajı yaparak duyarlı kişilerde ortostatik hipotansiyona yol açabilen H1 blokör grubu hangisidir?", "o": ["Piperidinler", "Fenotiyazinler", "Etilendiaminler", "Alkilaminler", "Piperazinler"], "a": 1, "e": "α-adrenerjik bloke edici etki özellikle fenotiyazin türevlerinde (prometazin, mekitazin) vardır. Fenotiyazinler ayrıca güçlü antiemetiktir."}, {"q": "Lokal anestezik (Na⁺ kanalı blokajı) etkisi en belirgin olan H1 blokörleri hangileridir?", "o": ["Loratadin ve setirizin", "Meklizin ve sinarizin", "Siproheptadin ve ketotifen", "Tripelenamin ve antazolin", "Prometazin ve difenhidramin"], "a": 4, "e": "Antihistaminiklerin çoğu uyarılabilir membranlarda Na⁺ kanallarını bloke edebilir; bu etki en fazla prometazin ve difenhidraminde gözlenir."}, {"q": "Noradrenalin geri alımını bloke ederek kokain benzeri sempatomimetik etki yapan antihistaminikler hangileridir?", "o": ["Siproheptadin ve ketotifen", "Tripelenamin ve antazolin", "Meklizin ve buklizin", "Prometazin ve mekitazin", "Loratadin ve terfenadin"], "a": 1, "e": "Tripelenamin ve antazolin NA geri alımını bloke eder. Siproheptadin ve ketotifen ise serotonin reseptörlerini bloke ederek iştah artışı ve kilo alımı yapar."}, {"q": "Antihistaminik etkisinin yanı sıra serotonin reseptörlerini bloke ederek iştah artışı ve kilo alımına yol açabilen ilaç hangisidir?", "o": ["Loratadin", "Famotidin", "Antazolin", "Dimenhidrinat", "Siproheptadin"], "a": 4, "e": "Siproheptadin ve ketotifen serotonin reseptörlerini de bloke ederek iştah artışı ve kilo alımına neden olur. Dimenhidrinat keyif verici etkisi nedeniyle kötüye kullanılabilir."}, {"q": "Aşağıdakilerden hangisi H1 reseptör blokörlerinin etkilerinden biri değildir?", "o": ["Mide asit salgısını azaltmak", "Kemoreseptör tetik bölgeyi inhibe etmek", "Sedasyon yapmak", "Lewis'in üçlü cevabını önlemek", "Ürtiker ve kaşıntıyı gidermek"], "a": 0, "e": "H1 blokörleri mide asit salgısına dokunmaz; asit salgısı H2 reseptörleri üzerinden gerçekleşir. Diğerleri H1 blokörlerinin direkt veya dolaylı etkileridir."}, {"q": "H1 reseptör blokörlerinin terapötik değeri olmayan durum hangisidir?", "o": ["Bronşiyal astım krizi", "Ürtiker", "Taşıt tutması", "Böcek sokması", "Saman nezlesi"], "a": 0, "e": "Astım krizinde bronkospazmdan esas olarak lökotrienler ve PAF sorumlu olduğu için H1 blokörlerinin terapötik değeri yoktur. Alerjik hastalıklar, hareket hastalığı, Meniere, kusma, nezle, premedikasyon ve Parkinson'da kullanılırlar."}, {"q": "Aşağıdakilerden hangisi H1 blokörleriyle birlikte alındığında CYP3A4 inhibisyonu yoluyla ventriküler aritmi gibi yan etkileri artırabilir?", "o": ["Fenobarbital", "Famotidin", "Karbamazepin", "Ketokonazol", "Rifampisin"], "a": 3, "e": "Ketokonazol, eritromisin ve diğer makrolidler ile greyfurt suyu CYP3A4'ü inhibe eder; H1 blokörlerinin düzeyini ve ventriküler aritmi gibi yan etkilerini artırır. Rifampisin, fenobarbital ve karbamazepin ise enzim indükleyicidir."}, {"q": "H2 reseptör blokörleri için aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Bronşiyal astım krizinde ilk tercih edilen ilaçlardır", "Yalnızca dışarıdan verilen histaminin etkisini bloke eder", "Vagus, gastrin, yemek, kafein ve insüline bağlı asit salgısını da bloke eder; parasempatolitiklerden daha güçlü antisekretuardır", "Kimyasal yapıları histamine benzemez", "Nonkompetitif antagonistlerdir"], "a": 2, "e": "H2 blokörlerinin yapısı histamine benzer, kompetitif antagonisttirler ve tüm uyaranlara bağlı mide asit salgısını bloke ederler; parasempatolitiklerden daha güçlü antisekretuardırlar."}, {"q": "Karaciğerde sitokrom P450 enzimlerini inhibe ederek varfarin, teofilin ve fenitoinin etkisini artıran H2 blokörü hangisidir?", "o": ["Ketotifen", "Famotidin", "Simetidin", "Ranitidin", "Nizatidin"], "a": 2, "e": "İlk H2 blokörü olan simetidin karma fonksiyonlu oksidazları (CYP450) inhibe eder; varfarin, morfin, teofilin, fenitoin, karbamazepin, propranolol, nifedipin, lidokain ve diazepamın etkisini artırır. Ranitidin, famotidin ve nizatidin CYP450 ile etkileşmez."}, {"q": "Değişmeden böbreklerden atıldığı için böbrek yetmezliğinde doz ayarlaması gereken, antiandrojenik etkisi ve mental konfüzyon yapıcı etkisi olmayan H2 blokörü hangisidir?", "o": ["Nizatidin", "Disodyum kromoglikat", "Betazol", "Difenhidramin", "Simetidin"], "a": 0, "e": "Nizatidin uzun etkili, değişmeden böbreklerden atılan, CYP450'ye etkisi olmayan bir H2 blokörüdür; böbrek yetmezliğinde doz ayarlanmalıdır. Yan etki olarak terleme, trombositopeni ve ürtiker yapabilir."}, {"q": "Aşağıdakilerden hangisi H2 reseptör blokörlerinin kullanım alanlarından biri değildir?", "o": ["Stres ülseri ve kanamaları", "Asit aspirasyon (Mendelson) sendromu", "Meniere hastalığı", "Gastroözofageal reflü hastalığı", "Zollinger-Ellison sendromu"], "a": 2, "e": "H2 blokörleri mide-duodenum ülseri, Zollinger-Ellison, Mendelson sendromu, GÖRH, stres ülseri ve karsinoid sendromda kullanılır; simetidin hirsutizm için de önerilmiştir. Meniere'de betahistin ve H1 blokörleri kullanılır."}, {"q": "Reseptörler üzerinde belirgin etki göstermeden mast hücre membranını stabilize ederek histamin salıverilmesini inhibe eden ilaç hangisidir?", "o": ["Disodyum kromoglikat", "Morfin", "Difenhidramin", "Betahistin", "Simetidin"], "a": 0, "e": "Mast hücre stabilizatörleri (disodyum kromoglikat, ketotifen, nedokromil) histamin ve diğer otakoidlerin salıverilmesini önler; bronşiyal astım ve alerjik hastalıklarda kullanılır."}, {"q": "Histamin intoleransı ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Histamin N-metiltransferaz aktivitesi aşırı yüksektir", "Diamin oksidaz düzeyi düşüktür ve alkol DAO etkisini azaltarak histamin birikimini artırır", "Yıllanmış peynir ve şarap histamin açısından fakirdir", "Belirtiler yalnızca solunum sistemiyle sınırlıdır", "Turunçgiller histamin içeriği yüksek olduğu için yasaktır"], "a": 1, "e": "Histamin intoleransında DAO düşük, histamin birikir; migren, GİS şikayetleri, kızarıklık, egzema, rinit, aritmi görülebilir. Şarap, yıllanmış peynir, mayalı besinler histaminden zengindir; turunçgiller ise düşük histaminli olmalarına rağmen bağlı histamini boşaltır."}];
const L = ['A','B','C','D','E'];
const list = document.getElementById('list');
let ok = 0, bad = 0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  list.innerHTML = DATA.map((d,i)=>`
  <div class="q" id="q${i}">
    <div class="q-head"><span class="q-num">${i+1}.</span><span class="q-text">${esc(d.q)}</span></div>
    <div class="opts">${d.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="letter">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="exp"><b>Doğru cevap: ${L[d.a]}</b> — ${esc(d.e)}</div>
  </div>`).join('');
}
function update(){
  const done = ok + bad;
  document.getElementById('sOk').textContent = 'Doğru: ' + ok;
  document.getElementById('sBad').textContent = 'Yanlış: ' + bad;
  document.getElementById('sLeft').textContent = 'Kalan: ' + (DATA.length - done);
  document.getElementById('prog').style.width = (done / DATA.length * 100) + '%';
  const r = document.getElementById('result');
  if (done === DATA.length){
    r.innerHTML = `<h2>Test tamamlandı</h2><p>${DATA.length} sorudan <b>${ok}</b> doğru, <b>${bad}</b> yanlış · Başarı: <b>%${Math.round(ok/DATA.length*100)}</b></p>`;
    r.classList.add('show');
  } else r.classList.remove('show');
}
list.addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b || b.disabled) return;
  const qi = +b.dataset.q, oi = +b.dataset.o, d = DATA[qi];
  const card = document.getElementById('q'+qi);
  card.querySelectorAll('.opt').forEach((x,j)=>{
    x.disabled = true;
    if (j === d.a) x.classList.add('correct');
    else if (j === oi) x.classList.add('wrong');
    else x.classList.add('dim');
  });
  card.classList.add('done');
  if (oi === d.a) ok++; else bad++;
  update();
});
document.getElementById('reset').addEventListener('click', ()=>{
  ok = 0; bad = 0; render(); update(); window.scrollTo({top:0,behavior:'smooth'});
});
render(); update();
</script>
</body>
</html>
