<script>
const DATA = [{"q": "Serotoninin kimyasal adı nedir?", "o": ["β-imidazoletilamin", "Gama-aminobütirik asit", "5-hidroksitriptamin", "1-alkil-2-asetilgliseril-3-fosfokolin", "3,4-dihidroksifenetilamin"], "a": 2, "e": "Serotonin (5-HT) kimyasal olarak 5-hidroksitriptamindir. Bu yapı halüsinojenik (psikedelik) ilaçlarda da bulunur. β-imidazoletilamin histamindir."}, {"q": "Vücuttaki serotoninin yaklaşık %95'i nerede bulunur?", "o": ["Pineal bezde", "Mast hücrelerinde", "Merkezi sinir sisteminde", "Mide-barsak kanalındaki enterokromafin hücrelerde", "Trombositlerde"], "a": 3, "e": "İnsan vücudunda ~10 mg serotonin vardır; %95'i GİS enterokromafin hücrelerinde, kalanı kanda trombositlerde ve SSS'de bulunur. Mast hücrelerinde normalde bulunmaz, bu hücrelerden kaynaklanan tümörlerde bulunur."}, {"q": "Serotonin aşağıdaki aminoasitlerden hangisinden sentezlenir?", "o": ["Triptofan", "Histidin", "Tirozin", "Fenilalanin", "Glutamat"], "a": 0, "e": "Serotonin besinlerle alınan triptofandan triptofan hidroksilaz ile sentezlenir. Histidinden histamin, tirozinden katekolaminler oluşur."}, {"q": "Serotonin sentezini inhibe eden ve deneysel olarak uykusuzluk oluşturan madde hangisidir?", "o": ["p-Klorfenilalanin", "Fenfluramin", "5-Hidroksitriptofan", "Buspiron", "Fluoksetin"], "a": 0, "e": "p-Klorfenilalanin triptofan hidroksilazı inhibe ederek serotonin sentezini azaltır; uykusuzluk yapar. Bu etki 5-hidroksitriptofan ile geri döner."}, {"q": "Serotoninin yıkımını sağlayan enzim ve oluşan yıkım ürünü hangisinde doğru verilmiştir?", "o": ["MAO-A — 5-hidroksiindol asetik asit (5-HIAA)", "Triptofan hidroksilaz — melatonin", "COMT — vanilmandelik asit", "MAO-B — homovanilik asit", "Diamin oksidaz — imidazol asetik asit"], "a": 0, "e": "Serotonin MAO-A ile yıkılır ve ana yıkım ürünü 5-HIAA'dır. Karsinoid tümörde plazma serotonini ve idrarda 5-HIAA artar."}, {"q": "SSS'de otoreseptör olarak görev yapan ve agonistleri migren tedavisinde kullanılan serotonin reseptörü hangisidir?", "o": ["5-HT2", "5-HT3", "5-HT4", "5-HT1C", "5-HT1D"], "a": 4, "e": "5-HT1D SSS'de otoreseptördür ve agonistleri (triptanlar, 5-HT1B/D agonisti) migren tedavisinde kullanılır. 5-HT1A depresyonla, 5-HT1C BOS yapımıyla ilişkilidir."}, {"q": "Vasküler düz kas ve GİS kontraksiyonu, trombosit agregasyonu, migren ve hipertansiyon ile ilişkili serotonin reseptörü hangisidir?", "o": ["5-HT1A", "5-HT2", "5-HT4", "5-HT6", "5-HT3"], "a": 1, "e": "5-HT2 reseptörleri vasküler düz kas, trombosit, akciğer, SSS ve GİS'te bulunur; düz kas kontraksiyonu, trombosit agregasyonu, migren ve hipertansiyonla ilişkilidir."}, {"q": "SSS, kalp ve GİS'te bulunan ve nörotransmitter salınımını aktive eden serotonin reseptörü hangisidir?", "o": ["5-HT5", "5-HT2", "5-HT1B", "5-HT4", "5-HT7"], "a": 3, "e": "5-HT4 reseptörleri SSS, kalp ve GİS'te bulunur ve nörotransmitter (ACh) salınımını aktive eder; agonistleri prokinetik etkilidir."}, {"q": "Serotonin ve histaminin düz kaslar üzerindeki etkileri karşılaştırıldığında hangisi doğrudur?", "o": ["Histamin vazodilatasyon ve diğer düz kaslarda konstriksiyon yaparken serotonin iskelet kası damar yatağı hariç vazokonstriksiyon ve diğer düz kaslarda kasılma yapar", "Her ikisi de tüm düz kasları gevşetir", "Serotonin vazodilatör, histamin vazokonstriktördür", "Serotonin düz kaslar üzerinde etkisizdir", "Histamin tüm düz kasları kasar, serotonin gevşetir"], "a": 0, "e": "Histamin damarları genişletir, diğer düz kasları büzer. Serotonin ise iskelet kası damar yatağı hariç vazokonstriksiyon yapar, GİS, uterus, mesane ve üreterde kasılma oluşturur; trombositlerde agregasyon yapar."}, {"q": "Serotoninin kalp üzerindeki etkisi hangisidir?", "o": ["Yalnızca negatif inotrop etki", "AV blok", "Pozitif kronotrop ve inotrop etki", "Kalp üzerine etkisizdir", "Negatif kronotrop ve inotrop etki"], "a": 2, "e": "Serotonin kalpte pozitif kronotrop ve pozitif inotrop etkilidir."}, {"q": "Serotoninin kan basıncı üzerindeki üç fazlı etkisinde ilk fazın nedeni nedir?", "o": ["Renin salgısının baskılanması", "İskelet kası damarlarında NO aracılı vazodilatasyon", "Direkt vazokonstriksiyonla kan basıncı artışı", "Aldosteron salgısının artması", "Vagus uyarılmasına bağlı Bezold-Jarisch refleksiyle kısa süreli kan basıncı düşmesi"], "a": 4, "e": "1. faz: vagus uyarılması (Bezold-Jarisch etkisi) ile çok kısa süreli düşme; 2. faz: direkt vazokonstriksiyon ve kemoreseptör aracılı vazomotor merkez uyarımıyla artış; 3. faz: iskelet kası damar yataklarında NO (EDRF) aracılı vazodilatasyonla düşme."}, {"q": "Serotoninin solunum sistemi üzerindeki etkileri hangisinde doğru verilmiştir?", "o": ["Yalnızca bronkodilatasyon yapar", "Solunumu deprese eder ve bronkodilatasyon yapar", "Solunumu yalnızca yüksek dozlarda uyarır", "Solunum üzerine etkisizdir", "Düşük dozlarda bile solunumu uyarır (hiperventilasyon) ve bronkospazm yapar"], "a": 4, "e": "Serotonin düşük dozlarda bile solunumu uyarır (hiperventilasyon) ve bronş düz kasında konstriksiyon yapar (bronkospazm)."}, {"q": "Trombositlerin serotonin ile ilişkisi için hangisi doğrudur?", "o": ["Serotonin trombositlerde agregasyonu inhibe eder", "Serotoninin esas sentez yeridir", "Serotonin sentezinde görevleri yoktur, ancak depolanma ve salınımında rol oynarlar", "Serotonini MAO ile yıkarlar", "Serotonini melatonine dönüştürürler"], "a": 2, "e": "Trombositler serotonin sentezlemez; GİS'ten aldıkları serotonini depolar ve endotel hasarında salıverirler. Serotonin trombosit agregasyonu yapar."}, {"q": "Serotoninin SSS üzerindeki etkileri ile ilgili hangisi yanlıştır?", "o": ["Migren patogenezinde rol oynar", "Serotonin kontrolündeki ilk tespit edilen davranış uyku-uyanıklık döngüsüdür", "Medial hipotalamustaki doygunluk merkezini inhibe ederek iştahı artırır", "Uyku, ısı düzenlenmesi, seksüel davranış ve hormon salınımında rol oynar", "Omurilikte 5-HT1B ve 5-HT3 aracılı analjezik etki gösterir"], "a": 2, "e": "Serotonin medial hipotalamustaki doygunluk merkezini uyararak iştahı baskılar; fenfluramin ve deksfenfluramin bu yolla iştah azaltır. 5-HT1A otoreseptör agonistleri serotonini azaltarak iştahı artırır."}, {"q": "Serotoninin gastrointestinal sistem üzerindeki net etkisi hangisidir?", "o": ["Motiliteyi azaltarak kabızlık", "Barsak düz kasını gevşetme", "İnce barsak kontraksiyonu, ACh salınımı ve motilite artışıyla diyare", "Mide boşalmasını geciktirme", "Asit salgısını artırarak ülser"], "a": 2, "e": "Serotonin ince barsak düz kasını kasar, peristaltizmi ve ACh salınımını uyarır, mide boşalmasını hızlandırır; net sonuç diyaredir."}, {"q": "Karsinoid tümör ile ilgili hangisi doğrudur?", "o": ["Adrenal medulla tümörüdür ve katekolamin salgılar", "Serotonin sentezleyen enterokromafin hücrelerin tümörüdür; plazma serotonini ve 5-HIAA artar, kızarma, diyare ve bronkospazm görülür", "Pankreas β hücre tümörüdür", "Pineal bez tümörüdür ve melatonin artar", "Mast hücrelerinin benign tümörüdür ve 5-HIAA azalır"], "a": 1, "e": "Karsinoid tümör GİS mukozası ve solunum yollarındaki enterokromafin hücrelerden kaynaklanır; serotonin ve 5-HIAA artar. Krizlerde yüzde kızarma, kan basıncı dalgalanması, kolik, diyare ve bronkospazm görülür."}, {"q": "Depresyon ve serotonin ilişkisi için hangisi doğrudur?", "o": ["SSRI'lar serotonin sentezini inhibe eder", "Depresyon tedavisinde 5-HT3 antagonistleri ilk seçenektir", "Depresyonda serotonerjik aktivite artmıştır", "Triptofan depresyonu ağırlaştırır", "Depresif hastaların BOS ve beyin dokusunda serotonin düzeyi düşük bulunmuştur; triptofan ve SSRI'lar antidepresan etkilidir"], "a": 4, "e": "Major depresyon olgularının bir kısmında serotonerjik aktivite düşüktür. Triptofan ve SSRI'lar (fluoksetin, paroksetin, sertralin) ile trazodon antidepresan etkilidir."}, {"q": "Atipik nöroleptikler (klozapin, risperidon) dopaminerjik inhibisyona ek olarak hangi reseptörleri bloke eder?", "o": ["5-HT1A ve 5-HT1D", "AT1 ve AT2", "5-HT3 ve 5-HT4", "5-HT2A ve 5-HT2C", "H1 ve H2"], "a": 3, "e": "Şizofrenide mezokortikolimbik dopaminerjik aşırı etkinlik vardır; klozapin ve risperidon dopaminerjik inhibisyonun yanı sıra 5-HT2A ve 5-HT2C blokajı yapar."}, {"q": "5-HT1A otoreseptör parsiyel agonisti olarak serotonerjik etkinliği azaltan ve anksiyolitik olarak kullanılan ilaç hangisidir?", "o": ["Fenfluramin", "Buspiron", "Sumatriptan", "Ondansetron", "Ketanserin"], "a": 1, "e": "Buspiron (ve gepiron, ipsapiron) 5-HT1A otoreseptör aktivasyonuyla serotonerjik etkinliği azaltarak anksiyolitik etki gösterir. Fenfluramin ise serotonin salınımını artırır, anksiyete oluşturabilir."}, {"q": "Uzun etkili olarak serotonin salınımını artıran ve iştah azaltıcı olarak kullanılan ilaç hangisidir?", "o": ["Buspiron", "Siproheptadin", "Fenfluramin", "Metiserjid", "p-Klorfenilalanin"], "a": 2, "e": "Fenfluramin serotonin salınımını artırır; iştah azaltıcı olarak kullanılır, duyarlı kişilerde anksiyete oluşturabilir. Siproheptadin ise tam tersine iştah açar."}, {"q": "Akut migren krizinde kullanılan, etkisi en çabuk başlayan 5-HT1B/D agonisti triptan hangisidir?", "o": ["Pizotifen", "Naratriptan", "Ondansetron", "Metiserjid", "Sumatriptan"], "a": 4, "e": "Triptanlar 5-HT1B/D agonistidir ve akut migren krizinde kullanılır; etkisi en çabuk başlayanı sumatriptandır. Pizotifen ve metiserjid profilaksi ilaçlarıdır."}, {"q": "Triptanların kontrendike olduğu durum hangisidir?", "o": ["Gastroözofageal reflü", "Koroner iskemi ve hipertansiyon", "Anksiyete bozukluğu", "Hipotiroidi", "Bronşiyal astım"], "a": 1, "e": "Triptanlar vazokonstriktör etkileri nedeniyle koroner iskemi ve hipertansiyonda kontrendikedir; MAO inhibitörleriyle birlikte kullanılmamalıdır."}, {"q": "Toksisitesi ve ani ölümlere yol açması nedeniyle piyasadan kaldırılan 5-HT4 agonisti hangisidir?", "o": ["Sisaprid", "Buspiron", "Metoklopramid", "Tegaserod", "Ondansetron"], "a": 0, "e": "Sisaprid 5-HT4 agonistidir ve GÖRH'de kullanılmıştır; toksisite ve ani ölümler nedeniyle piyasadan kaldırılmıştır. Tegaserod irritabl barsak sendromunda kullanılır."}, {"q": "Metoklopramidin serotonin reseptörleri üzerindeki etkisi hangisidir?", "o": ["5-HT1A parsiyel agonisti", "5-HT4 agonisti, 5-HT3 blokörü", "5-HT2A blokörü", "5-HT1D agonisti", "5-HT3 agonisti, 5-HT4 blokörü"], "a": 1, "e": "Metoklopramid 5-HT4 aktivasyonuyla motiliteyi artırır (prokinetik) ve 5-HT3 blokajıyla güçlü antiemetik etki yapar. Epilepsili hastalarda nöbetleri tetikleyebilir."}, {"q": "Kemoterapiye bağlı bulantı-kusmada kullanılan 5-HT3 antagonisti hangisidir?", "o": ["Sumatriptan", "Pizotifen", "Ondansetron", "Ketanserin", "Sisaprid"], "a": 2, "e": "Ondansetron, tropisetron ve granisetron 5-HT3 antagonistidir; kemoterapiye bağlı bulantı-kusmada kullanılır."}, {"q": "Migren tedavisinde reseptör etkileri hangisinde doğru eşleştirilmiştir?", "o": ["5-HT4 agonistleri profilakside kullanılır", "5-HT1 agonistleri profilakside, 5-HT2 antagonistleri akut atakta etkilidir", "5-HT3 antagonistleri akut atakta ilk seçenektir", "Migrende serotonerjik ilaçların yeri yoktur", "5-HT1 agonistleri akut atakta, 5-HT2 antagonistleri profilakside etkilidir"], "a": 4, "e": "Sumatriptan gibi 5-HT1 agonistleri akut atakta, pizotifen ve metiserjid gibi 5-HT2 antagonistleri profilakside etkilidir. Nöbetler sıksa profilaksi, seyrekse akut tedavi yapılır."}, {"q": "Migren atağı ile serotonin düzeyi arasındaki ilişki hangisidir?", "o": ["Serotoninin migrenle ilişkisi yoktur", "Atak öncesi düşük, atak sonrası yüksektir", "Yalnızca atak sırasında 5-HIAA azalır", "Atak öncesi serotonin düzeyi yüksek, atak geçtikten sonra düşüktür", "Atak boyunca sabit kalır"], "a": 3, "e": "Migren atağından önce serotonin düzeyi yüksek olur, atak geçtikten sonra düşer."}, {"q": "Histamin ve 5-HT2 antagonisti olup iştah açıcı etkisiyle anoreksia nervosa ve karsinoid tedavisinde kullanılan ilaç hangisidir?", "o": ["Fenfluramin", "Ketanserin", "Siproheptadin", "Buspiron", "Ritanserin"], "a": 2, "e": "Siproheptadin histamin ve 5-HT2 antagonistidir; iştah açar ve anoreksia nervosa ile karsinoid tedavisinde kullanılır."}, {"q": "α1 ve 5-HT2 antagonisti olup antihipertansif etkili, trombosit agregasyonunu inhibe eden ve Raynaud vazospazmında kullanılan ilaç hangisidir?", "o": ["Ondansetron", "Sumatriptan", "Metoklopramid", "Ketanserin", "Siproheptadin"], "a": 3, "e": "Ketanserin α1, 5-HT1C ve 5-HT2 antagonistidir; antihipertansif ve antiagregan etkilidir, Raynaud sendromunda vazospazma karşı kullanılır."}, {"q": "SSRI'lar ile ilgili hangisi doğrudur?", "o": ["Fluoksetin en güçlü olanıdır ve metaboliti inaktiftir", "Sertralinin metaboliti aktiftir", "Paroksetin en zayıf etkilidir", "Paroksetin en güçlü, sertralin en spesifik, fluoksetin en zayıf etkilidir ve fluoksetinin metaboliti de aktiftir", "SSRI'lar serotonin sentezini artırır"], "a": 3, "e": "Fluoksetin en zayıf etkilidir ve metaboliti de aktiftir; paroksetin en güçlüdür, sertralin en spesifiktir ve her ikisinin metaboliti inaktiftir. SSRI'lar presinaptik geri alımı bloke eder."}, {"q": "Obsesif kompulsif bozuklukta kullanılan serotonin ve noradrenalin geri alım inhibitörü hangisidir?", "o": ["Klomipramin", "Buspiron", "Sumatriptan", "Ondansetron", "Fenfluramin"], "a": 0, "e": "Klomipramin (Anafranil) serotonin ve NA geri alım inhibitörüdür ve obsesif kompulsif bozuklukta kullanılır; venlafaksin de bu gruptadır."}, {"q": "Akut migren krizlerinin tedavisinde en sık kullanılan ergot alkaloidleri hangileridir?", "o": ["Ergotoksin ve bromokriptin", "Ergotamin ve dihidroergotamin", "Bromokriptin ve ergonovin", "Metiserjid ve pizotifen", "Ergonovin ve metiserjid"], "a": 1, "e": "Ergotamin ve dihidroergotamin akut migren krizlerinde en sık kullanılan ergot alkaloidleridir. Metiserjid ise migren profilaksisinde kullanılan ergot türevidir."}, {"q": "Ergot alkaloidlerinin kardiyovasküler etkileri için hangisi doğrudur?", "o": ["Vazokonstriksiyon ve endotel zedelenmesiyle ekstremite uçlarında gangren oluşabilir", "Endoteli koruyarak trombüs oluşumunu engellerler", "Vazodilatasyonla total periferik direnci azaltırlar", "Yalnızca venleri genişletirler", "Kalp hızını değiştirmezler"], "a": 0, "e": "Ergot alkaloidleri vazokonstriksiyonla total periferik direnci artırır, endoteli zedeler ve mikrotrombüs oluşturur; bunların sonucu ekstremite uçlarında gangren gelişebilir."}, {"q": "Ergot alkaloidlerinin SSS etkileri için hangisi yanlıştır?", "o": ["CTZ'yi uyararak bulantı-kusma yaparlar", "Ön hipofizden prolaktin salgısını artırırlar", "Bromokriptin galaktore tedavisinde kullanılır", "Dopamin agonisti etkiyle prolaktini inhibe ederler", "Sedasyon yaparlar"], "a": 1, "e": "Ergot alkaloidleri dopamin agonisti etkiyle prolaktin salgısını inhibe eder; bromokriptin galaktore tedavisinde kullanılır. Ayrıca CTZ'yi uyarır ve sedasyon yapar."}, {"q": "Aşağıdakilerden hangisi ergot alkaloidlerinin kontrendikasyonlarından biri değildir?", "o": ["Periferik damar hastalığı", "Koroner kalp hastalığı", "Gebelik", "Galaktore", "Karaciğer yetmezliği"], "a": 3, "e": "Ergot alkaloidleri gebelik, periferik damar ve serebrovasküler hastalık, karaciğer yetmezliği, koroner kalp hastalığı ve sepsiste kontrendikedir. Galaktore ise bromokriptinin endikasyonudur."}, {"q": "Ergot alkaloidlerinin kronik kullanımında görülen tablo hangisidir?", "o": ["Serotonin sendromu", "Karsinoid sendrom", "Kuşing sendromu", "Ergotizm", "Lewis'in üçlü cevabı"], "a": 3, "e": "Kronik kullanımda ergotizm gelişir. Ayrıca bulantı-kusma, diyare, kramplar, ekstremitelerde soğuma, parestezi, koroner kan akımında azalma ve uzun kullanımda ilaca bağlı baş ağrısı görülebilir."}, {"q": "Peptid yapılı otakoidlerden plazma kininlerinin nöromediyatör etkili alt grubu hangisidir?", "o": ["Taşikininler", "Bradikininler", "Kalikreinler", "Anjiyotensinler", "Endotelinler"], "a": 0, "e": "Plazma kininleri parakrin etkili vazodilatör bradikininler ve nöromediyatör etkili taşikininler (P maddesi, nörokinin A ve B) olarak ikiye ayrılır."}, {"q": "Renin-anjiyotensin sisteminde en etkili vazokonstriktör olan anjiyotensin hangisidir ve hangi enzimle oluşur?", "o": ["Anjiyotensin I — aminopeptidaz", "Anjiyotensin I — renin", "Anjiyotensin III — anjiyotensinaz", "Anjiyotensinojen — kalikrein", "Anjiyotensin II — anjiyotensin dönüştürücü enzim (ADE)"], "a": 4, "e": "Renin anjiyotensinojeni anjiyotensin I'e, ADE anjiyotensin I'i en güçlü vazokonstriktör olan anjiyotensin II'ye çevirir. Anjiyotensinaz/aminopeptidaz Ang II'den Ang III oluşturur."}, {"q": "Hormonal renin salgısını artıran faktör hangisidir?", "o": ["Renal perfüzyon basıncının artması", "NSAİİ kullanımı", "Vazopresin", "Anjiyotensin II'nin JG hücrelerindeki AT reseptörlerini uyarması", "Makula densada tübül sıvısındaki Na⁺ ve Cl⁻ konsantrasyonunun azalması"], "a": 4, "e": "Hipotansiyon/GFR azalması (intrarenal baroreseptör), makula densada Na⁺-Cl⁻ azalması, sempatik uyarı (katekolaminler) ve PGE₂/PGI₂ renin salgısını artırır. Anjiyotensin (negatif feedback), vazopresin ve NSAİİ'ler azaltır."}, {"q": "Anjiyotensin II'nin farmakolojik etkileri için hangisi yanlıştır?", "o": ["Zona glomerulozadan aldosteron salgısını artırır", "Kan basıncını artırırken refleks taşikardi yapar", "En güçlü vazokonstriktör maddelerden biridir", "Kalp ve damar çeperinde hipertrofi yapar, ET-1 salıverir", "Böbrekte aferent ve eferent arteriyolleri büzerek GFR ve Na⁺ atılımını azaltır"], "a": 1, "e": "Ang II'nin yükselttiği kan basıncı refleks bradikardi yapar. Ang II en güçlü vazokonstriktörlerdendir; böbrek damarları çok duyarlıdır; aldosteron, susama, sempatik aktivite, hipertrofi ve ET-1 salıverilmesini artırır."}, {"q": "AT2 reseptörlerinin etkileri için hangisi doğrudur?", "o": ["Antimitojenik, NO aracılı vazodilatör ve natriüretik etki; fötusta böbrek gelişimi", "Endotelin sentezi artışı", "Myokard ve düz kas hipertrofisi", "Vazokonstriksiyon ve aldosteron salgısı artışı", "Tuz iştahı ve vazopresin salgısı artışı"], "a": 0, "e": "AT1 reseptörleri vazokonstriksiyon, aldosteron, hipertrofi, fibrozis, tuz iştahı ve ET-1 artışından sorumludur. AT2 ise antimitojenik, doku onarımı, fötal böbrek gelişimi, NO aracılı vazodilatasyon ve natriürez sağlar."}, {"q": "Renin salgılayan tümörlerde plazma renin etkinliği (PRE) ve aldosteron durumu nasıldır?", "o": ["PRE azalır, aldosteron değişmez", "PRE artar, aldosteron azalır", "PRE normaldir", "PRE azalır ve primer aldosteronizm gelişir", "PRE artar ve sekonder aldosteronizm gelişir"], "a": 4, "e": "Renin salgılayan tümörlerde PRE artar ve sekonder aldosteronizm gelişir. Primer aldosteronizmde ise hipertansiyon vardır ve feedback ile PRE azalır."}, {"q": "Renin inhibitörü olarak bilinen ilaç hangisidir?", "o": ["Kaptopril", "Aprotinin", "Ketanserin", "Losartan", "Aliskiren"], "a": 4, "e": "Pepstatin ve aliskiren renin inhibitörüdür; etkileri ADE inhibitörlerine göre daha zayıftır. Kaptopril ADE inhibitörü, losartan AT1 reseptör blokörüdür."}, {"q": "ADE inhibitörlerinin kuru öksürük yan etkisinin nedeni hangisidir?", "o": ["Anjiyotensin II'nin bronşları gevşetmesi", "Histamin salıverilmesinin azalması", "ADE'nin aynı zamanda kininaz II olması nedeniyle bradikininin yıkılamayıp birikmesi", "Aldosteron düzeyinin artması", "Renin salgısının baskılanması"], "a": 2, "e": "ADE = kininaz II'dir. ADE inhibitörleri Ang II oluşumunu azaltırken bradikinin yıkımını da engeller; biriken bradikinin vazodilatasyona katkı sağlar ve kuru öksürüğe yol açar. Hiperkalemi ve tat bozukluğu da yan etkilerdir."}, {"q": "Aşağıdakilerden hangisi anjiyotensin reseptör blokörüdür?", "o": ["Aprotinin", "Valsartan", "Enalapril", "Fosinopril", "Aliskiren"], "a": 1, "e": "Losartan, valsartan, kandesartan, telmisartan ve irbesartan anjiyotensin reseptör (AT1) blokörleridir. Enalapril ve fosinopril ADE inhibitörü, aliskiren renin inhibitörüdür."}, {"q": "Kalikrein-kinin sisteminde doku kalikreininin kininojenlerden oluşturduğu ürün hangisidir?", "o": ["P maddesi", "Anjiyotensin I", "Prekalikrein", "Kalidin", "Bradikinin"], "a": 3, "e": "Doku kalikreini kininojenlerden kalidini, plazma kalikreini ise bradikinini oluşturur; kalidin de bradikinine dönüşür. Kalikrein = kininojenaz."}, {"q": "Prekalikreini aktif kalikreine dönüştüren faktörler hangisinde doğru verilmiştir?", "o": ["Endopeptidaz ve EDE-1", "Hageman faktörü, tripsin ve kalikrein", "Fosfolipaz A₂ ve COX", "Renin ve ADE", "Trombin ve plazmin"], "a": 1, "e": "Kalikrein böbrekte sentezlenir; plazma ve dokularda prekalikrein şeklinde bulunur ve Hageman faktörü, tripsin ve kalikrein ile aktif kalikreine dönüşür."}, {"q": "Bradikininin farmakolojik etkileri için hangisi yanlıştır?", "o": ["Kan basıncını uzun süreli ve belirgin şekilde yükseltir", "Duodenum hariç barsak düz kasını ve bronşları kasar", "Güçlü aljezik etki gösterir ve kan-beyin bariyerini bozar", "Postkapiller venüllerde permeabiliteyi artırır", "En güçlü vazodilatörlerdendir ve etkisi NO aracılıdır"], "a": 0, "e": "Bradikinin NO aracılı güçlü vazodilatördür; kan basıncında belirgin fakat kısa süreli düşme yapar. Permeabiliteyi artırır, hipovolemi ve Lewis'in üçlü cevabını oluşturur, damar dışı düz kasları (duodenum hariç) kasar, güçlü ağrı yapar ve immün stimülan etkilidir."}, {"q": "Normal dokuda bulunmayan, iltihap gibi patolojik durumlarda indüklenen kinin reseptörü hangisidir?", "o": ["B2", "AT2", "B1", "5-HT3", "AT1"], "a": 2, "e": "B1 reseptörleri normal dokuda yoktur; iltihapta indüklenir, proinflamatuardır, alerji ve astımda önemlidir. B2 reseptörleri sinir uçlarında ağrı, damarda vazodilatasyon ve permeabilite artışına aracılık eder."}, {"q": "Aşırı kalikrein salgısının eşlik ettiği hastalıklarda kullanılan kalikrein inhibitörü hangisidir?", "o": ["Ondansetron", "Kaptopril", "Aliskiren", "Aprotinin (Trasylol)", "Bromokriptin"], "a": 3, "e": "Aprotinin (Trasylol) kalikrein inhibitörüdür ve aşırı kalikrein salgısının eşlik ettiği hastalıkların tedavisinde kullanılır."}];
const L = ['A','B','C','D','E'];
const list = document.getElementById('list');
let ok = 0, bad = 0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  list.innerHTML = DATA.map((d,i)=>`
  <div class="q" id="q${i}">
    <div class="q-head"><span class="q-num">${i+1}.</span><span class="q-text">${esc(d.q)}</span></div>
    <div class="opts">${d.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="letter">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="exp"><b>Doğru cevap: ${L[d.a]}</b> — ${esc(d.e)}</div>
  </div>`).join('');
}
function update(){
  const done = ok + bad;
  document.getElementById('sOk').textContent = 'Doğru: ' + ok;
  document.getElementById('sBad').textContent = 'Yanlış: ' + bad;
  document.getElementById('sLeft').textContent = 'Kalan: ' + (DATA.length - done);
  document.getElementById('prog').style.width = (done / DATA.length * 100) + '%';
  const r = document.getElementById('result');
  if (done === DATA.length){
    r.innerHTML = `<h2>Test tamamlandı</h2><p>${DATA.length} sorudan <b>${ok}</b> doğru, <b>${bad}</b> yanlış · Başarı: <b>%${Math.round(ok/DATA.length*100)}</b></p>`;
    r.classList.add('show');
  } else r.classList.remove('show');
}
list.addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b || b.disabled) return;
  const qi = +b.dataset.q, oi = +b.dataset.o, d = DATA[qi];
  const card = document.getElementById('q'+qi);
  card.querySelectorAll('.opt').forEach((x,j)=>{
    x.disabled = true;
    if (j === d.a) x.classList.add('correct');
    else if (j === oi) x.classList.add('wrong');
    else x.classList.add('dim');
  });
  card.classList.add('done');
  if (oi === d.a) ok++; else bad++;
  update();
});
document.getElementById('reset').addEventListener('click', ()=>{
  ok = 0; bad = 0; render(); update(); window.scrollTo({top:0,behavior:'smooth'});
});
render(); update();
</script>

</html>
