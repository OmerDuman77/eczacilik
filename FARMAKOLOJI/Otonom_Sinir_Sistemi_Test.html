<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--muted:#6b6b6b;--accent:#1a6b4e;--accent-light:#e8f5ee;--border:#e2ddd5;
--ok:#1f7a4d;--ok-bg:#d3eedd;--ok-bd:#2f9a63;--bad:#b5442d;--bad-bg:#f8d8cf;--bad-bd:#cf5a40;--exp-bg:#fdf8f0;--exp-bd:#e8c87a}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
.hero{padding:3rem 1.5rem 2rem;text-align:center;background:linear-gradient(135deg,#1a6b4e,#0d3d2d);color:#fff;position:relative}
.hero::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.back-link{position:relative;z-index:1;display:inline-flex;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem;margin-bottom:1rem}
.back-link:hover{color:#fff}
.hero h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700}
.hero p{opacity:.85;margin-top:.4rem}
.bar{position:sticky;top:0;z-index:10;background:rgba(247,245,240,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.bar-in{max-width:820px;margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.stats{display:flex;gap:.5rem;flex-wrap:wrap;flex:1}
.pill{font-size:.85rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border);background:#fff;font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}
.pill.bad{color:var(--bad);border-color:var(--bad-bd);background:var(--bad-bg)}
.progress{height:4px;background:var(--border);width:100%}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.btn{padding:.55rem 1.1rem;border:2px solid var(--accent);border-radius:8px;font:600 .9rem 'Source Sans 3',sans-serif;cursor:pointer;background:#fff;color:var(--accent);transition:background .2s,color .2s}
.btn:hover{background:var(--accent);color:#fff}
.container{max-width:820px;margin:0 auto;padding:2rem 1.5rem 4rem}
.q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.25rem 1.1rem;margin-bottom:1rem}
.q-head{display:flex;gap:.7rem;margin-bottom:.9rem}
.q-num{color:var(--accent);font-weight:700;min-width:1.8rem}
.q-text{font-weight:600;font-size:1rem}
.opts{display:flex;flex-direction:column;gap:.45rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;width:100%;padding:.65rem .8rem;border:1.5px solid var(--border);border-radius:9px;background:#fff;font:400 .95rem 'Source Sans 3',sans-serif;color:var(--text);cursor:pointer;transition:none}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fafcfa}
.opt:disabled{cursor:default}
.letter{flex-shrink:0;width:1.6rem;height:1.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;background:var(--accent-light);color:var(--accent)}
.opt.correct{border-color:var(--ok-bd);background:var(--ok-bg);color:#14472e;font-weight:600}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-bd);background:var(--bad-bg);color:#6e2414}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.exp{display:none;margin-top:.85rem;padding:.75rem .9rem;background:var(--exp-bg);border-left:3px solid var(--exp-bd);border-radius:0 6px 6px 0;font-size:.92rem;color:#3d2f0a}
.exp b{color:var(--ok)}
.q.done .exp{display:block}
.result{display:none;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:1.5rem}
.result.show{display:block}
.result h2{font-family:'Playfair Display',serif;color:var(--accent);margin-bottom:.4rem}
footer{text-align:center;padding:2rem 1rem;font-size:.82rem;color:var(--muted);border-top:1px solid var(--border)}
@media(max-width:600px){.hero h1{font-size:1.5rem}.bar-in{padding:.6rem 1rem}.container{padding:1.25rem 1rem 3rem}.q{padding:1rem}.opt{font-size:.9rem}}
</style>
</head>

<script>
const DATA = [{"q": "Otonom sinir sistemi aşağıdakilerden hangisini kontrol eder?", "o": ["Yalnızca omurilik reflekslerini", "Hafıza ve öğrenmeyi", "Yalnızca iskelet kaslarını", "Düz kaslar, kalp ve salgı bezleri gibi istem dışı çalışan yapıları", "İstemli hareketleri başlatmayı"], "a": 3, "e": "Otonom sinir sistemi kardiyak output, organ kanlanması ve sindirim gibi otomatik viseral fonksiyonları; kalp, iç organlar, salgı bezleri ve damarları kontrol eder. İskelet kaslarını somatik sinir sistemi kontrol eder."}, {"q": "“Savaş veya kaç” reaksiyonundan sorumlu sistem ve “dinlen ve beslen” sistemi hangisinde doğru eşleştirilmiştir?", "o": ["Sempatik — savaş veya kaç; parasempatik — dinlen ve beslen", "Merkezi sinir sistemi — savaş veya kaç; periferik — dinlen ve beslen", "Her ikisi de sempatik sisteme aittir", "Somatik — savaş veya kaç; otonom — dinlen ve beslen", "Parasempatik — savaş veya kaç; sempatik — dinlen ve beslen"], "a": 0, "e": "Sempatik sistem korku, heyecan, stres durumlarında “savaş veya kaç” yanıtını; parasempatik sistem enerjiyi koruyan “dinlen ve beslen” durumunu sağlar."}, {"q": "Merkezi sinir sistemi ile gangliyon arasındaki sinir kısmına ne ad verilir?", "o": ["Efektör lif", "Postgangliyoner lif", "Pregangliyoner lif", "Afferent lif", "Motor son plak"], "a": 2, "e": "Otonom lifler SSS'den çıkıp gangliyonda kesintiye uğrar: SSS ile gangliyon arası pregangliyoner, gangliyon ile organ arası postgangliyoner liftir."}, {"q": "Otonom sinir sisteminin başlıca nörotransmitterleri hangileridir?", "o": ["Asetilkolin ve noradrenalin", "GABA ve glutamat", "Dopamin ve serotonin", "Adrenalin ve dopamin", "Histamin ve serotonin"], "a": 0, "e": "OSS'nin başlıca nörotransmitterleri asetilkolin (kolinerjik lifler) ve noradrenalindir (adrenerjik lifler). Her ikisi de sinir uçlarında sentezlenip veziküllerde depolanır."}, {"q": "Otonom sinir sistemi reseptörlerinin sınıflandırması hangisinde doğrudur?", "o": ["Kolinerjik (muskarinik, nikotinik) ve adrenerjik (alfa, beta)", "Kolinerjik (alfa, beta) ve adrenerjik (muskarinik, nikotinik)", "Dopaminerjik ve serotonerjik", "H1 ve H2", "Yalnızca muskarinik ve nikotinik"], "a": 0, "e": "OSS reseptörleri kolinerjik (muskarinik M, nikotinik N) ve adrenerjik (α, β) olarak ayrılır; alt tiplerin dokulardaki dağılımı ve ilaçlara duyarlılığı farklıdır."}, {"q": "Aşağıdakilerden hangisi parasempatik sistemin organlar üzerindeki etkilerinden biri değildir?", "o": ["Tükürük ve bağırsak salgılarını artırır", "Sfinkterleri gevşetir", "Göz bebeklerini genişletir", "Kalp hızını yavaşlatır", "Solunum yollarını daraltır"], "a": 2, "e": "Parasempatik sistem kalbi yavaşlatır, bronşları ve pupillayı daraltır (miyozis), salgıları ve barsak hareketlerini artırır, sfinkterleri gevşetir. Göz bebeğini genişleten (midriyazis) sempatik sistemdir."}, {"q": "Aşağıdakilerden hangisi sempatik sistemin etkilerinden biridir?", "o": ["Bronşları daraltır", "Kalp hızını yavaşlatır", "Miyozis yapar", "Barsak hareketlerini artırır", "Kan şekeri seviyesini artırır ve sfinkterleri kasar"], "a": 4, "e": "Sempatik uyarı midriyazis, taşikardi, kan basıncı artışı, terleme, bronkodilatasyon, kan şekeri artışı ve sindirim/idrar yolu sfinkterlerinin kasılmasını sağlar."}, {"q": "Aşağıdakilerden hangisi sempatomimetik ilaçların kullanım alanlarından biri değildir?", "o": ["Miyokard kontraktilitesini ve kan basıncını artırmak", "Lokal anesteziklerin etki süresini uzatmak", "Bronkospazmı gidermek", "Glokomda miyozis oluşturmak", "Şiddetli alerjik reaksiyonlar"], "a": 3, "e": "Sempatomimetikler kontraktilite/kan basıncını artırmak, bronkospazm, şiddetli alerji ve lokal anesteziklerin emilimini azaltıp etkisini uzatmak için kullanılır. Miyozis parasempatomimetik etkidir."}, {"q": "Sempatomimetik ilaçların oluşturduğu etkiler için hangisi yanlıştır?", "o": ["Hiperpotasemi", "İskelet kası damarlarında vazodilatasyon", "Bronkodilatasyon", "Yağ dokusundan serbest yağ asidi salınımı", "Hepatik glikojenoliz"], "a": 0, "e": "Sempatomimetikler vazokonstriksiyon, iskelet kasında vazodilatasyon, bronkodilatasyon, kardiyak stimülasyon, glikojenoliz, lipoliz ve SSS uyarımının yanı sıra hipopotasemi yapar."}, {"q": "Aşağıdakilerden hangisi katekolamin yapısında olmayan bir sempatomimetiktir?", "o": ["Dobutamin", "Adrenalin", "Efedrin", "Dopamin", "Noradrenalin"], "a": 2, "e": "Katekolaminler: adrenalin, noradrenalin, izoprenalin, dopamin, dobutamin. Katekolamin olmayanlar: efedrin, fenilefrin, metaraminol, metoksamin."}, {"q": "Adrenalinin doza bağlı reseptör etkileri hangisinde doğru verilmiştir?", "o": ["Yalnızca α reseptörlerine etkilidir", "Düşük dozda β, yüksek dozda α reseptörlerine etkilidir", "Muskarinik reseptörleri uyarır", "Düşük dozda α, yüksek dozda β reseptörlerine etkilidir", "Yalnızca dopaminerjik reseptörlere etkilidir"], "a": 1, "e": "Adrenalin düşük dozda damar β reseptörleriyle vazodilatasyon ve kan basıncı düşmesi, yüksek dozda α reseptörleriyle vazokonstriksiyon yapar."}, {"q": "Adrenalinin etkileri için hangisi yanlıştır?", "o": ["Solunum yolu düz kaslarını gevşetir", "GİS ve mesane cidar kaslarını gevşetip sfinkterleri kasar", "Karaciğer ve iskelet kasında glukoz ve laktat üretimini hızlandırır", "Uterus kasılmalarını artırır", "Kalbin kasılma gücünü ve hızını artırır"], "a": 3, "e": "Adrenalin uterus kasılmalarını azaltır. Uterus kasılmalarını güçlendirip sıklaştıran noradrenalindir."}, {"q": "Aşağıdakilerden hangisi adrenalinin endikasyonlarından biri değildir?", "o": ["Lokal anesteziklerin etki süresinin uzatılması", "Anafilaktik şok", "Myastenia gravis tedavisi", "Kalp durması", "Bronkospazm"], "a": 2, "e": "Adrenalin bronkospazm, anafilaktik şok dahil hipersensitivite reaksiyonları, lokal anesteziklerin etkisini uzatma, kronik açık açılı glokom ve kalp durmasında kullanılır. Myastenia gravis'te antikolinesterazlar kullanılır."}, {"q": "Noradrenalin ile ilgili hangisi doğrudur?", "o": ["Esas olarak α reseptörlerine etkilidir; i.v. infüzyonla verilir ve cilt altına kaçırılırsa nekroz yapar", "Oral yolla etkilidir", "Böbrek kan akımını artırdığı için şokta ilk tercihtir", "Esas olarak β2 reseptörlerine etkilidir ve astımda kullanılır", "Uterus kasılmalarını azaltır"], "a": 0, "e": "Noradrenalin (levarterenol) α reseptörlere etkilidir; böbrek dahil damarları büzer, sistolik-diyastolik basıncı artırır, uterusu kasar. Sadece i.v. verilir; cilt altına kaçarsa nekroz yapar. Dopamin böbrek kan akımını azaltmadığı için şokta daha uygundur."}, {"q": "Dopaminin doza bağlı etkileri için hangisi doğrudur?", "o": ["Böbrek kan akımını her dozda azaltır", "Düşük dozda α reseptörleriyle vazokonstriksiyon yapar", "Oral olarak kullanılır", "Yüksek dozda yalnızca D2 reseptörlerini uyarır", "Düşük dozda D1/D2 reseptörleriyle böbrek ve iç organ kan akımını artırır; çok yüksek dozda α reseptörleriyle vazokonstriksiyon yapar"], "a": 4, "e": "Dopamin düşük dozda D1/D2 ile renal ve splanknik vazodilatasyon, β1 ile kalp hızı ve kasılma gücü artışı, çok yüksek dozda α ile vazokonstriksiyon yapar. Sadece i.v. infüzyonla verilir."}, {"q": "Dopaminin endikasyonları hangisinde doğru verilmiştir?", "o": ["Astım krizi", "Glokom", "Erken doğumun engellenmesi", "Nazal dekonjesyon", "Kardiyojenik ve septik şok; dijital ve diüretiklere yanıt vermeyen düşük debili kalp yetmezliği"], "a": 4, "e": "Dopamin akut MI veya kalp cerrahisindeki kardiyojenik şokta, septik şokta ve dirençli düşük debili konjestif kalp yetmezliğinde kullanılır."}, {"q": "β1 ve β2 reseptörlerini eşit derecede aktive eden ve kalp bloğu/ağır bradikardide kısa süreli acil tedavide kullanılan sentetik katekolamin hangisidir?", "o": ["Dobutamin", "Fenilefrin", "Salbutamol", "İzoproterenol (izoprenalin)", "Noradrenalin"], "a": 3, "e": "İzoproterenol β1 (kalp hızı ve kasılma artışı) ve β2 (bronkodilatasyon, vazodilatasyon) reseptörlerini eşit aktive eder; kalp bloğu ve ağır bradikardide kullanılır. Taşikardi ve ektopik atımlar yapabilir."}, {"q": "Kalp hızını belirgin değiştirmeden kontraktiliteyi artırdığı için miyokard oksijen gereksinimini artırmayan β1 agonisti hangisidir?", "o": ["Adrenalin", "Efedrin", "Dobutamin", "İzoproterenol", "Noradrenalin"], "a": 2, "e": "Dobutamin kısa etkili sentetik katekolamindir; β1 üzerinden kontraktiliteyi ve debiyi artırır, kalp hızını belirgin değiştirmez. Konjestif kalp yetmezliği ve kalp cerrahisinde kullanılır; %5 glukozda çözülüp i.v. infüzyonla verilir, tolerans gelişebilir."}, {"q": "Erken doğumun engellenmesinde kullanılan uterus gevşetici β agonisti hangisidir?", "o": ["Fenilefrin", "Ritodrin", "Metoksamin", "Nafazolin", "Oksimetazolin"], "a": 1, "e": "Ritodrin ve terbutalin β agonist olarak uterusu gevşetir ve erken doğumun engellenmesinde kullanılır. Nafazolin, oksimetazolin, ksilometazolin α agonist dekonjestandır."}, {"q": "Aşağıdakilerden hangisi nazal dekonjestan olarak kullanılan α agonistidir?", "o": ["Salbutamol", "Dobutamin", "Ritodrin", "Ksilometazolin", "Terbutalin"], "a": 3, "e": "Nafazolin, tetrahidrozolin, ksilometazolin ve oksimetazolin α agonist dekonjestanlardır. Salbutamol ve terbutalin β2 agonist bronkodilatörlerdir."}, {"q": "Efedrin ile ilgili hangisi yanlıştır?", "o": ["Gece işemelerine karşı kullanılabilir", "Kan-beyin bariyerini geçemez ve SSS etkisi yoktur", "Kardiyovasküler hastalık ve hipertiroidide dikkatli kullanılmalıdır", "Bronş genişletici ve nazal dekonjestan olarak kullanılır", "Etkileri adrenaline benzer"], "a": 1, "e": "Efedrin katekolamin olmayan, KBB'yi geçen bir sempatomimetiktir; uyanıklık hali oluşturmak için de kullanılır. Kalbi uyardığı için kardiyovasküler hastalık ve hipertiroidide dikkat gerekir."}, {"q": "Aşağıdaki β blokörlerden hangisi kardiyoselektif (β1 seçici) değildir?", "o": ["Asebutolol", "Atenolol", "Esmolol", "Metoprolol", "Propranolol"], "a": 4, "e": "Propranolol, nadolol ve timolol non-selektiftir (β1 ve β2). Atenolol, metoprolol, asebutolol ve esmolol β1 seçicidir (kardiyoselektif)."}, {"q": "β blokajının yanı sıra α1 reseptörlerini de bloke eden ilaçlar hangileridir?", "o": ["Atenolol ve metoprolol", "Labetalol ve karvedilol", "Prazosin ve doksazosin", "Esmolol ve timolol", "Propranolol ve nadolol"], "a": 1, "e": "Labetalol ve karvedilol β + α1 blokördür. Labetalol gebelikte hipertansiyonda, karvedilol kalp yetmezliğinde kullanılır."}, {"q": "Yarılanma ömrü yaklaşık 10 dakika olan ultra kısa etkili β1 seçici blokör hangisidir?", "o": ["Labetalol", "Atenolol", "Esmolol", "Propranolol", "Nadolol"], "a": 2, "e": "Esmolol'ün yarılanma ömrü ~10 dakikadır. Nadolol uzun etkilidir (14–24 saat)."}, {"q": "β adrenerjik reseptör blokörlerinin etkileri için hangisi yanlıştır?", "o": ["Kalp debisi ve oksijen tüketimini azaltırlar", "Kan basıncını düşürürler", "Bronş düz kaslarını gevşetirler", "Sempatik uyarıya bağlı çarpıntı ve titremeyi azaltırlar", "Kalp hızını ve kasılma gücünü azaltırlar"], "a": 2, "e": "β blokörler bronş düz kaslarını kasar (özellikle non-selektifler); bu yüzden astımda bronkospazma yol açabilir. Ayrıca yağ asitleri ve hiperglisemiyi azaltırlar."}, {"q": "Aşağıdakilerden hangisi β blokörlerin endikasyonlarından biri değildir?", "o": ["Bronşiyal astım", "Hipertansiyon", "Hipertiroidizm", "Migren profilaksisi", "Miyokard iskemisi"], "a": 0, "e": "β blokörler miyokard iskemisi, hipertansiyon, aritmi, taşikardi, migren profilaksisi ve hipertiroidizmde kullanılır. Astımda bronkospazm riski nedeniyle kaçınılır."}, {"q": "α adrenerjik reseptör blokörlerinin etkileri için hangisi doğrudur?", "o": ["Plazma hacmini azaltarak ödemi önlerler", "Kan basıncını yükseltirler", "Damar düz kaslarını kasarlar", "Refleks bradikardi yaparlar", "Postural hipotansiyon ve refleks taşikardi yapabilir, zamanla su-tuz tutulumuyla tolerans gelişebilir"], "a": 4, "e": "α blokörler damar düz kasını gevşetip kan basıncını düşürür; ayağa kalkınca postural hipotansiyon ve refleks taşikardi yaparlar. Zamanla su-tuz tutulumu ve periferik ödemle hipotansif etkiye tolerans gelişebilir."}, {"q": "Selektif α1 blokörleri ile ilgili hangisi yanlıştır?", "o": ["Benign prostat hipertrofisi tedavisinde önemli yerleri vardır", "Prazosin, terazosin ve doksazosin bu gruptadır", "Antihipertansif tedavide etkindirler", "İlk doz fenomenine neden olabilirler, doz titrasyonu gerekir", "Lipid profilini olumsuz etkilerler"], "a": 4, "e": "Selektif α1 blokörlerinin lipid profili üzerine olumlu etkileri vardır. Antihipertansiftirler, ilk doz fenomeni yapabilirler ve BPH'de kullanılırlar."}, {"q": "Feokromositoma tedavisinde kullanılan non-selektif α blokörü hangisidir?", "o": ["Klonidin", "Propranolol", "Prazosin", "Fenoksibenzamin", "Tamsulosin"], "a": 3, "e": "Non-selektif α blokörler (fentolamin, fenoksibenzamin, tolazolin) hem α1 hem α2'yi bloke eder ve feokromositoma tedavisinde kullanılır. Fenoksibenzamin uzun etkili ve nonkompetitif, fentolamin hızlı etkili ve kompetitiftir."}, {"q": "Sitoplazmadan noradrenalin, dopamin ve serotoninin veziküllere taşınmasını engelleyerek depoları boşaltan ilaç hangisidir?", "o": ["Prazosin", "Guanetidin", "Klonidin", "Metildopa", "Rezerpin"], "a": 4, "e": "Rezerpin veziküler depolamayı engeller; sitoplazmadaki NA MAO ile yıkılır, depolar tamamen boşalır. Etkisi bırakıldıktan günler sonra bile sürer; depresyon, sedasyon ve bradikardi yapabilir."}, {"q": "Gebelikte hipertansiyon tedavisinde tercih edilen, santral etkili olarak sempatik çıkışı azaltan ilaç hangisidir?", "o": ["Guanetidin", "Propranolol", "Fentolamin", "Metildopa", "Rezerpin"], "a": 3, "e": "Metildopa santral etkiyle sempatik çıkışı azaltır ve gebelikte hipertansiyonda kullanılır; sedasyon, karaciğer toksisitesi ve hemolitik anemi yapabilir."}, {"q": "α2 agonisti olarak NA salınımını azaltan ve aniden kesilince rebound hipertansiyon yapabilen ilaç hangisidir?", "o": ["Klonidin", "Metildopa", "Labetalol", "Doksazosin", "Rezerpin"], "a": 0, "e": "Klonidin α2 agonistidir, NA salınımını azaltır; hipertansiyon ve yoksunluk sendromunda kullanılır. Rebound hipertansiyon, ağız kuruluğu ve sedasyon yapabilir."}, {"q": "Parasempatomimetik ilaçların farmakolojik etkileri için hangisi yanlıştır?", "o": ["Sindirim kanalı salgı ve hareketlerini artırırlar", "Vazodilatasyon yapıp kan basıncını düşürürler", "Ter, tükürük ve gözyaşı salgısını artırırlar", "Kalbin kasılma gücünü ve hızını azaltırlar", "Midriyazis yaparlar"], "a": 4, "e": "Parasempatomimetikler miyozis (göz bebeğinin büzülmesi) yapar. Ayrıca uterus, üreter, mesane ve solunum yolu düz kaslarını kasarlar."}, {"q": "Asetilkolinesteraz tarafından parçalanmayan ve postoperatif ileus ile atonik mesanede kullanılan kolinomimetik hangisidir?", "o": ["Fizostigmin", "Betanekol", "Edrofonyum", "Atropin", "Asetilkolin"], "a": 1, "e": "Betanekol AChE ile parçalanmaz; ameliyat sonrası mide-barsak peristaltizmini uyarmak ve atonik mesanede kullanılır. Asetilkolin hızla yıkıldığı için ilaç olarak pek kullanılmaz."}, {"q": "Glokom tedavisinde kullanılan ve gözyaşı, ter, tükürük bezlerini de uyaran parasempatomimetik hangisidir?", "o": ["Pilokarpin", "Neostigmin", "Edrofonyum", "Skopolamin", "Betanekol"], "a": 0, "e": "Pilokarpin glokom tedavisinde kullanılır; gözyaşı, ter ve tükürük bezlerini aşırı çalıştırır. Karbakol da miyotik damla olarak göz içi basıncını düşürür."}, {"q": "Atropin zehirlenmesinde i.v. uygulanan ve SSS'ye geçebilen antikolinesteraz hangisidir?", "o": ["Betanekol", "Neostigmin", "Edrofonyum", "Fizostigmin", "Piridostigmin"], "a": 3, "e": "Fizostigmin bitkisel kökenli, AChE'yi geçici inhibe eden ve SSS'ye geçen bir ilaçtır; atropin, trisiklik antidepresan ve fenotiyazin zehirlenmelerinde kullanılır."}, {"q": "Neostigmin ile ilgili hangisi doğrudur?", "o": ["Muskarinik reseptör blokörüdür", "Atropin zehirlenmesinde ilk seçenektir", "Bitkisel kökenlidir ve SSS'ye kolay geçer", "Sentetiktir, SSS'ye geçemez ve iskelet kaslarında daha güçlü etki gösterir; myastenia gravis'te kullanılır", "Etki süresi 10–20 dakikadır ve tanıda kullanılır"], "a": 3, "e": "Neostigmin sentetik bir AChE inhibitörüdür, SSS'ye geçmez, iskelet kasında güçlü etkilidir. Myastenia gravis'te antikorlar nikotinik reseptörleri işgal eder; neostigmin ACh'yi artırarak kas gücünü düzeltir."}, {"q": "Hızlı emilen, 10–20 dakika etkili olup myastenia gravis tanısında kullanılan antikolinesteraz hangisidir?", "o": ["Fizostigmin", "Pilokarpin", "Neostigmin", "Edrofonyum", "Piridostigmin"], "a": 3, "e": "Edrofonyum (Tensilon) kısa etkili bir AChE inhibitörüdür; myastenia gravis tanısında kullanılır."}, {"q": "Aşağıdakilerden hangisi parasempatomimetik ilaçların kontrendikasyonlarından biri değildir?", "o": ["Peptik ülser", "Bronşiyal astım", "Glokom", "Hipertiroidizm", "GİS ve üriner sistemde mekanik tıkanıklık"], "a": 2, "e": "Parasempatomimetikler astım, peptik ülser, hipertiroidizm, koroner kalp hastalığı ve mekanik tıkanıklıklarda kontrendikedir. Glokom ise endikasyonlarıdır (pilokarpin, karbakol)."}, {"q": "Parasempatolitik (antikolinerjik) ilaçların etkileri için hangisi yanlıştır?", "o": ["Taşikardi yaparlar", "Tükürük, ter ve solunum yolu salgılarını artırırlar", "Midriyazis yaparlar", "GİS, mesane ve üreter düz kaslarını gevşetirler", "Bronkodilatör etki gösterirler"], "a": 1, "e": "Antikolinerjikler tükürük, gözyaşı, ter, solunum yolu ve sindirim salgılarını azaltır. Taşikardi, midriyazis, spazmolitik ve bronkodilatör etki gösterirler; kan basıncını pek etkilemezler."}, {"q": "Atropinin kalp hızı üzerindeki doza bağlı etkisi hangisidir?", "o": ["Düşük dozda bradikardi, en az 1 mg'da taşikardi yapar", "Her dozda bradikardi yapar", "Düşük dozda taşikardi, yüksek dozda bradikardi yapar", "Kalp hızını etkilemez", "Yalnızca kan basıncını yükseltir"], "a": 0, "e": "Atropin düşük dozda bradikardi, en az 1 mg dozda taşikardi yapar; kan basıncını değiştirmez. Bradikardi ve bazı kalp bloklarında, preanestezide ve organofosfat zehirlenmesinde antidot olarak kullanılır."}, {"q": "Organofosfat (insektisit) zehirlenmesinde antidot olarak kullanılan ilaç hangisidir?", "o": ["Pilokarpin", "Betanekol", "Neostigmin", "Fizostigmin", "Atropin"], "a": 4, "e": "Organofosfatlar AChE'yi inhibe ederek aşırı kolinerjik uyarı yapar; muskarinik blokör atropin antidot olarak kullanılır."}, {"q": "Atropine benzeyen ancak SSS etkileri daha güçlü, etkisi daha uzun ve sedatif olan, taşıt tutması ve Meniere'de tercih edilen antikolinerjik hangisidir?", "o": ["Hyosin-N-butil bromür", "Skopolamin", "Pirenzepin", "İpratropium", "Tropikamid"], "a": 1, "e": "Skopolamin (Antinozan) SSS etkileri atropinden güçlü, etkisi uzun ve sedatiftir; taşıt tutması ve Meniere hastalığında kullanılır."}, {"q": "Astım ve KOAH tedavisinde bronkodilatör olarak kullanılan sentetik antimuskarinik hangisidir?", "o": ["Neostigmin", "İpratropium bromür", "Hyosin-N-butil bromür", "Skopolamin", "Pipenzolat"], "a": 1, "e": "İpratropium bromür inhaler antimuskarinik bronkodilatördür; astım ve KOAH'ta kullanılır. Hyosin-N-butil bromür (Buscopan) GİS antispazmodiğidir."}, {"q": "Antikolinerjik ilaçların kullanılmaması gereken durum hangisidir?", "o": ["Organofosfat zehirlenmesi", "Göz muayenesinde midriyazis", "Glokom ve prostat hipertrofisi", "Preanestezik sekresyon azaltma", "Taşıt tutması"], "a": 2, "e": "Antikolinerjikler göz içi basıncını artırabileceği ve idrar retansiyonu yapabileceği için glokom ve prostat hipertrofisinde kullanılmamalıdır. Yan etkiler: taşikardi, midriyazis, fotofobi, ağız kuruluğu, ciltte kızarma, ateş."}, {"q": "Kolin'in sinir ucuna Na⁺ bağımlı girişini engelleyerek asetilkolin sentezini bozan madde hangisidir?", "o": ["Vezamikol", "Lobelin", "Hekzametonyum", "Botulinum toksini", "Hemikolinyum"], "a": 4, "e": "Hemikolinyum kolin alımını engelleyerek ACh sentezini bozar. Vezamikol ACh'nin veziküle alınmasını, botulinum toksini ve lokal anestezikler salıverilmesini engeller; hekzametonyum reseptör etkileşimini önler, lobelin ACh'yi taklit eder."}, {"q": "Aşağıdakilerden hangisi otonom gangliyonları önce uyarıp sonra bloke eden ilaçlardan biridir?", "o": ["Mekamilamin", "Trimetafan", "Nikotin", "Tetraetilamonyum", "Hekzametonyum"], "a": 2, "e": "Nikotin (ayrıca fizostigmin, neostigmin ve organofosfat zehirlenmesi) gangliyonları önce uyarır, uzun süreli uyarı sonunda depolarizasyon felciyle bloke eder. Hekzametonyum, TEA, mekamilamin, trimetafan doğrudan bloke eder."}, {"q": "Nikotinin doza bağlı kardiyovasküler etkisi için hangisi doğrudur?", "o": ["Düşük dozda bradikardi, yüksek dozda hipertansiyon yapar", "Düşük dozda kalp hızı ve kan basıncını artırır, yüksek dozda tersi etki yapar", "Her dozda kan basıncını düşürür", "Kardiyovasküler etkisi yoktur", "Pıhtılaşmayı azaltır"], "a": 1, "e": "Nikotin düşük dozda sempatik etkiyle kalp hızı ve kan basıncını artırır, yüksek dozda sempatolitik/depresan etki yapar. Kalbin oksijen ihtiyacını artırıp oransal kan akımını azaltır, pıhtılaşmayı kolaylaştırır."}, {"q": "Kuarterner yapıdaki gangliyon blokörlerinin aksine, oral biyoyararlanımı iyi olan ve kan-beyin bariyerini kolayca geçen ikincil amin gangliyon blokörü hangisidir?", "o": ["Trimetafan", "Mekamilamin", "Hekzametonyum", "Tetraetilamonyum", "Pentolinyum"], "a": 1, "e": "Kuarterner amin türevleri (hekzametonyum, TEA) oral yoldan az emilir ve KBB'yi geçemez. İkincil amin olan mekamilamin oral yoldan iyi emilir ve KBB'yi geçer; p.o. uzun etkilidir. Trimetafan i.v. kısa etkilidir."}, {"q": "Gangliyon blokörlerinin etkileri için hangisi yanlıştır?", "o": ["Miyozis yapar ve göz uyumunu iyileştirirler", "Arter ve venleri genişletip kan basıncını düşürürler", "Ayağa kalkınca bayılmaya neden olabilirler", "İdrar tutukluğu ve cinsel işlev bozukluğu yaparlar", "Sindirim hareketlerini ve salgıları azaltırlar"], "a": 0, "e": "Gangliyon blokörleri pupillayı genişletir ve göz uyumunu bozar. Sempatik ve parasempatik ganglionları ayrım yapmadan bloke ettikleri için hipotansiyon, kabızlık, salgı azalması, idrar tutukluğu ve cinsel işlev bozukluğu görülür."}];
const L = ['A','B','C','D','E'];
const list = document.getElementById('list');
let ok = 0, bad = 0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  list.innerHTML = DATA.map((d,i)=>`
  <div class="q" id="q${i}">
    <div class="q-head"><span class="q-num">${i+1}.</span><span class="q-text">${esc(d.q)}</span></div>
    <div class="opts">${d.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="letter">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="exp"><b>Doğru cevap: ${L[d.a]}</b> — ${esc(d.e)}</div>
  </div>`).join('');
}
function update(){
  const done = ok + bad;
  document.getElementById('sOk').textContent = 'Doğru: ' + ok;
  document.getElementById('sBad').textContent = 'Yanlış: ' + bad;
  document.getElementById('sLeft').textContent = 'Kalan: ' + (DATA.length - done);
  document.getElementById('prog').style.width = (done / DATA.length * 100) + '%';
  const r = document.getElementById('result');
  if (done === DATA.length){
    r.innerHTML = `<h2>Test tamamlandı</h2><p>${DATA.length} sorudan <b>${ok}</b> doğru, <b>${bad}</b> yanlış · Başarı: <b>%${Math.round(ok/DATA.length*100)}</b></p>`;
    r.classList.add('show');
  } else r.classList.remove('show');
}
list.addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b || b.disabled) return;
  const qi = +b.dataset.q, oi = +b.dataset.o, d = DATA[qi];
  const card = document.getElementById('q'+qi);
  card.querySelectorAll('.opt').forEach((x,j)=>{
    x.disabled = true;
    if (j === d.a) x.classList.add('correct');
    else if (j === oi) x.classList.add('wrong');
    else x.classList.add('dim');
  });
  card.classList.add('done');
  if (oi === d.a) ok++; else bad++;
  update();
});
document.getElementById('reset').addEventListener('click', ()=>{
  ok = 0; bad = 0; render(); update(); window.scrollTo({top:0,behavior:'smooth'});
});
render(); update();
</script>
</body>
</html>
