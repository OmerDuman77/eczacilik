<script>
const DATA = [{"q": "Eikozanoidler ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Yalnızca prostat bezinde sentezlenen salgılardır", "Peptid yapısında hormonlardır", "Aminoasitlerin dekarboksilasyonuyla oluşan biyojenik aminlerdir", "On altı karbonlu yağ asitlerinden türeyen ekzojen maddelerdir", "Yirmi karbon atomlu yağ asitlerinden türeyen, güçlü biyolojik etkinlik gösteren endojen maddelerdir"], "a": 4, "e": "Eikozanoidler (eikosa = yirmi) 20 karbonlu yağ asitlerinden, başta araşidonik asitten türeyen ve güçlü biyolojik etkinliği olan endojen maddelerdir."}, {"q": "Eikozanoidler, oluşumlarında rol oynayan enzime göre hangi üç ana gruba ayrılır?", "o": ["Siklooksijenaz, lipoksijenaz ve P450 monooksijenaz ürünleri", "Tromboksan sentaz, prostasiklin sentaz ve endopeptidaz ürünleri", "Fosfolipaz, lipaz ve esteraz ürünleri", "COX-1, COX-2 ve COX-3 ürünleri", "Dekarboksilaz, transaminaz ve oksidaz ürünleri"], "a": 0, "e": "Eikozanoidler prekürsör yağ asitlerinden oluşmalarında rol oynayan enzime göre siklooksijenaz ürünleri, lipoksijenaz ürünleri ve P450 monooksijenaz ürünleri olarak üç ana gruba ayrılır."}, {"q": "Prostaglandin kelimesinin kökeni ve ilk izolasyonu ile ilgili hangisi doğrudur?", "o": ["Pankreastan adını almış; 1935'te Bergström tarafından bulunmuştur", "Plasentadan adını almış; 1982'de amniyon sıvısında bulunmuştur", "Prostat bezinden adını almış; 1935'te seminal sıvıda Ulf von Euler ve Goldblatt tarafından izole edilmiştir", "Prostat bezinden adını almış; 1971'de John Vane tarafından izole edilmiştir", "Prostasiklinden adını almış; 1971'de kanda bulunmuştur"], "a": 2, "e": "Prostaglandin adı prostat bezinden gelir. İlk kez 1935'te seminal sıvıda Ulf von Euler ve M.W. Goldblatt tarafından izole edilmiş, sonra pek çok dokuda sentezlendiği anlaşılmıştır."}, {"q": "Aspirin ve benzeri ilaçların prostaglandin sentezini inhibe ettiği hangi yıl bulunmuştur?", "o": ["1935", "1980", "1982", "1998", "1971"], "a": 4, "e": "1971'de aspirin ve benzerlerinin PG sentezini inhibe ettiği bulunmuştur. 1982'de Bergström, Samuelsson ve Vane bu çalışmalarla Nobel ödülü almıştır."}, {"q": "1982 Nobel Fizyoloji veya Tıp ödülünü prostaglandin çalışmalarıyla alan bilim insanları hangisinde doğru verilmiştir?", "o": ["Banting, Best ve Macleod", "Von Euler, Goldblatt ve Dale", "Bergström, Samuelsson ve Vane", "Furchgott, Zawadzki ve Ignarro", "Fleming, Florey ve Chain"], "a": 2, "e": "Sune K. Bergström, Bengt I. Samuelsson ve John R. Vane 1982'de prostaglandinler ve ilişkili biyolojik aktif maddeler üzerine buluşlarıyla Nobel ödülü almıştır."}, {"q": "Araşidonik asidin membran fosfolipidlerinden serbestleşmesini sağlayan ve glukokortikoidlerce inhibe edilen enzim hangisidir?", "o": ["Endotelin dönüştürücü enzim", "Siklooksijenaz", "5-lipoksijenaz", "Fosfolipaz A₂", "Tromboksan sentaz"], "a": 3, "e": "Fosfolipaz A₂ membran fosfolipidlerinden araşidonik asidi açığa çıkarır. Glukokortikoidler bu basamağı inhibe ederek hem COX hem LOX ürünlerinin sentezini azaltır."}, {"q": "Eikozanoidlerin salıverilme şekli için hangisi doğrudur?", "o": ["Mast hücre granüllerinde depolanırlar", "Depolanmaksızın, ihtiyaç anında sentezlenip salıverilirler", "Heparin ile kompleks halinde saklanırlar", "Sinaptik veziküllerde depolanırlar", "Karaciğerde depo edilip kana verilirler"], "a": 1, "e": "Eikozanoidler depolanmaz; uyarıyla fosfolipidlerden sentezlenip hemen salıverilirler. Histamin ise mast hücre granüllerinde depolanır."}, {"q": "Prostanoidler (prostaglandinler, prostasiklin, tromboksanlar) hangi enzimler aracılığıyla oluşur?", "o": ["Endopeptidaz", "Sitokrom P450 monooksijenaz", "Fosfolipaz C", "5-lipoksijenaz", "Siklooksijenaz (COX-1 ve COX-2)"], "a": 4, "e": "Prostanoidler COX-1 ve COX-2 enzimleriyle oluşur. Lökotrienler (LTA₄, LTB₄, LTC₄, LTD₄, LTE₄) lipoksijenaz ürünleridir."}, {"q": "COX-1 ve COX-2 ile ilgili hangisi doğrudur?", "o": ["COX-1 indüklenebilir, COX-2 yapısaldır", "COX-1 lökotrien sentezinden sorumludur", "COX-1 yapısaldır, inhibisyonu mide mukozasında koruyucu etkinin kalkmasıyla ülsere eğilim yapar; COX-2 inflamatuar uyaranlarla indüklenir", "COX-2 inhibisyonu mide ülserinin asıl nedenidir", "Her ikisi de yalnızca inflamasyonda eksprese edilir"], "a": 2, "e": "COX-1 yapısal (constitutive) olarak bulunur; inhibisyonu mide mukozasındaki koruyucu PG'leri azaltarak gastrit/ülsere eğilim yapar. COX-2 indüklenebilir, inflamatuar uyaranlarla miktarı artar."}, {"q": "Lökotrienlerin sentez yolunda 5-lipoksijenazın oluşturduğu ara ürün hangisidir?", "o": ["15-HETE", "5-HPETE", "PGG₂", "TxB₂", "PGH₂"], "a": 1, "e": "Araşidonik asit 5-lipoksijenazla 5-HPETE'ye, oradan LTA₄'e dönüşür; LTA₄'ten LTB₄ ve LTC₄→LTD₄→LTE₄ oluşur. PGG₂ ve PGH₂ siklooksijenaz yolunun ara ürünleridir."}, {"q": "Prostaglandin E ve F'ler esas olarak nasıl metabolize edilir?", "o": ["Mast hücrelerinde depolanarak", "Safra ile değişmeden atılarak", "Plazmada enzimatik olmayan hidrolizle TxB₂'ye dönüşerek", "Sentezlendikleri dokularda veya kan dolaşımı sırasında akciğerlerde", "Yalnızca böbrekte değişmeden atılarak"], "a": 3, "e": "PGE ve PGF'ler sentezlendikleri dokuda veya dolaşımda akciğerlerde metabolize edilir. PGI₂ karaciğer ve böbrekte metabolize edilir ve plazmada enzimatik olmayan yıkıma uğrar; TxA₂ enzimatik olmayan hidrolizle TxB₂'ye dönüşebilir."}, {"q": "Kardiyovasküler sistemde vazokonstriktör etkili eikozanoidler hangisinde birlikte verilmiştir?", "o": ["TxA₂ ve PGF₂α", "PGE₂ ve PGE₁", "PGI₂ ve LTB₄", "PGE₁ ve PGI₂", "PGE₂ ve PGI₂"], "a": 0, "e": "PGE₂ ve PGI₂ vazodilatör olup kan basıncını düşürür; TxA₂ ve PGF₂α vazokonstriktördür."}, {"q": "Prostaglandinlerin kalp üzerindeki etkisi ile ilgili hangisi doğrudur?", "o": ["Koroner damarları büzerek iskemi yaparlar", "Doğrudan AV blok oluştururlar", "Kalp hızını doğrudan azaltırlar", "Güçlü negatif inotrop etki yaparlar", "Doğrudan etkileri yoktur; vazodilatör PG'ler ve PGI₂ refleks taşikardi ve kalp debisinde artış yapar"], "a": 4, "e": "PG'lerin kalp üzerine doğrudan etkisi yoktur. Vazodilatör PG'ler ve PGI₂ kan basıncını düşürerek refleks taşikardi ve kalp debisinde artışa neden olur."}, {"q": "Gastrointestinal kanalda mide asit salgısını inhibe eden ve sitoprotektif etkili prostanoidler hangileridir?", "o": ["TxA₂ ve LTB₄", "LTB₄ ve LTD₄", "PGF₂α ve LTC₄", "PGE ve PGI₂", "TxA₂ ve PGF₂α"], "a": 3, "e": "PGE ve PGI₂ mide asit salgısını inhibe eder, mukus ve pankreas dış salgısını artırır ve sitoprotektif etki gösterir. Bu yüzden NSAİİ'ler ülser riskini artırır."}, {"q": "Bronşlar üzerinde PGE ve PGF₂α'nın etkileri hangisinde doğru verilmiştir?", "o": ["PGE bronkokonstriksiyon, PGF₂α bronkodilatasyon yapar", "Her ikisi de bronkokonstriksiyon yapar", "Bronşlar üzerinde etkileri yoktur", "PGE bronkodilatasyon, PGF₂α bronkokonstriksiyon yapar", "Her ikisi de bronkodilatasyon yapar"], "a": 3, "e": "PGE bronkodilatör, PGF₂α bronkokonstriktördür; bu denge bronşiyal astım nöbetlerinde önemlidir."}, {"q": "NSAİİ'lerin bazı hastalarda bronkospazma yol açmasının olası nedeni hangisidir?", "o": ["β₂ reseptörlerinin doğrudan blokajı", "Fosfolipaz A₂'nin inhibisyonu", "PGE₂ sentezinin artması", "COX'un inhibe edilmesiyle araşidonik asidin lipoksijenaz yoluna kayarak lökotrien üretiminin artması", "Histaminin mast hücrelerinden doğrudan salıverilmesi"], "a": 3, "e": "NSAİİ'ler COX'u bloke edince araşidonik asit LOX yoluna yönelir; artan lökotrienler (özellikle LTC₄/LTD₄) bronkospazma yol açabilir."}, {"q": "Trombosit fonksiyonları açısından PGI₂ ve TxA₂ için hangisi doğrudur?", "o": ["Her ikisi de agregasyonu stimüle eder", "Trombositler üzerinde etkileri yoktur", "PGI₂ trombosit agregasyon ve adezyonunu inhibe eder, TxA₂ agregasyonu stimüle eder", "Her ikisi de agregasyonu inhibe eder", "PGI₂ agregasyonu stimüle eder, TxA₂ inhibe eder"], "a": 2, "e": "PGI₂ (prostasiklin) antiagregan, TxA₂ proagregandır. PGI₂/TxA₂ oranı trombosit fonksiyonlarının göstergesidir; dengenin TxA₂ lehine bozulması tromboz ve ateroskleroz riskini artırır."}, {"q": "Üreme sistemindeki prostaglandinler için hangisi yanlıştır?", "o": ["Sperma sıvısında PG konsantrasyonu çok yüksektir", "Kısır erkeklerin sperma sıvısında PG konsantrasyonu yüksek bulunmuştur", "PGE ve PGF'ler oksitosik etkilidir", "Aborsiyon veya doğum eyleminin başlamasında rol oynarlar", "Spermatozoidlerin uterin tüpe geçişi ve döllenmede rol oynarlar"], "a": 1, "e": "Kısır erkeklerde PG konsantrasyonu düşük bulunmuştur. PGE ve PGF'ler uterusta ritmik kasılmalar (oksitosik etki) yapar."}, {"q": "Böbrekte PGE₂ ve PGI₂'nin etkileri için hangisi yanlıştır?", "o": ["PGI₂ renin ve eritropoetin salgısını artırır", "Böbrek kan akımını ve GFR'yi azaltarak su ve tuz tutulumu yaparlar", "Vazodilatör etki gösterirler", "Natriüretik etki gösterirler", "PGE₂ vazopresinin etkisini antagonize ederek diüretik etki yapar"], "a": 1, "e": "PGE₂ ve PGI₂ böbrekte vazodilatördür; böbrek kan akımını ve GFR'yi artırır, natriüretik etki yapar. PGE₂ vazopresini antagonize eder; prostasiklin renin ve eritropoetin salgısını artırır. Su-tuz retansiyonu ve GFR azalması endotelin (ET-1) etkisidir."}, {"q": "Sinir sisteminde konvülsan etkili prostaglandin hangisidir?", "o": ["PGE₂", "PGI₂", "Tüm PGE'ler", "PGE₁", "PGF₂α"], "a": 4, "e": "PGE'ler antikonvülsan, PGF₂α konvülsan etkilidir."}, {"q": "Yağ dokusunda güçlü antilipolitik etkisi olan prostaglandin hangisidir?", "o": ["PGE₁", "TxA₂", "PGI₂", "PGF₂α", "LTB₄"], "a": 0, "e": "PGE₁ yağ dokusunda güçlü antilipolitik etki gösterir. Ayrıca PG'ler ön hipofizden TSH, ACTH, GH, LH, FSH salınımını artırır."}, {"q": "Periferik sinir sisteminde sempatik adrenerjik uçlardan noradrenalin salıverilmesini inhibe eden prostaglandinler hangileridir?", "o": ["PGF₂α", "LTD₄", "PGE'ler", "TxA₂", "PAF"], "a": 2, "e": "PGE'ler sempatik uçlardan NE salıverilmesini inhibe eder; PGF₂α ise stimüle eder. Kolinerjik uçlarda PG'ler genellikle ACh salgısını artırır."}, {"q": "Ağrıya neden olabilen ve bradikininin oluşturduğu ağrıyı potansiyelize eden eikozanoidler hangileridir?", "o": ["PGI₂ ve TxA₂", "PGF₂α ve LTE₄", "PGE ve LTB₄", "TxB₂ ve PGE₁", "LTC₄ ve PAF"], "a": 2, "e": "PGE ve LTB₄'ün ağrıya sebep oldukları ve bradikininin oluşturduğu ağrıyı potansiyelize ettikleri gösterilmiştir. PGE₂ en güçlü proinflamatuar ve hiperaljezik eikozanoiddir."}, {"q": "Göz ve kemik üzerindeki PG etkileri için hangisi doğrudur?", "o": ["PG'ler midriyazis yapar ve kemik yapımını artırır", "PGF₂α göz içi basıncını artırır", "PGE'ler kemik rezorpsiyonunu azaltarak hipokalsemi yapar", "PGI₂ göz içi basıncını yükseltir", "PGE ve PGF₂α miyozis yapar; PGE'ler PTH benzeri etkiyle kemik rezorpsiyonunu ve kan Ca²⁺ düzeyini artırır"], "a": 4, "e": "PGE ve PGF₂α gözde miyozis yapar; PGF₂α analoğu latanoprost göz içi basıncını düşürür. PGE'ler PTH benzeri etkiyle kemik rezorpsiyonunu ve kan kalsiyumunu artırır."}, {"q": "İnflamasyonda prostaglandinlerin rolü ile ilgili hangisi yanlıştır?", "o": ["Lökositlerin dokuya infiltrasyonunu artırırlar", "Akut iltihaplı dokuda sentezleri azalır", "PGE₂ proinflamatuar ve hiperaljezik etkilidir", "Lokal uygulandıklarında damar permeabilitesini artırırlar", "Kızarıklık, ödem ve ağrıya yol açarlar"], "a": 1, "e": "Akut iltihaplı dokuda PG sentezi artar. PG'ler permeabiliteyi artırır, kızarıklık, ödem, ağrı yapar ve lökotaktik etki gösterir."}, {"q": "Dismenorede rol oynayan mekanizma hangisidir?", "o": ["Luteal dönemde artan PGF₂α'nın vazokonstriktör ve oksitosik etkisiyle endometriumun atılması", "LTB₄'ün kemotaktik etkisi", "PGI₂'nin uterusta gevşeme yapması", "PGE₁'in antilipolitik etkisi", "TxA₂'nin azalmasıyla kanama eğilimi"], "a": 0, "e": "Menstrüel siklusun luteal döneminde artan PGF₂α vazokonstriksiyon ve oksitosik etkiyle endometriumun atılmasına ve menstrüel kanamaya neden olur."}, {"q": "Diabetes mellitusta ateroskleroz gelişimini hızlandıran eikozanoid değişikliği hangisidir?", "o": ["PGE₂ ve PGI₂ artışı", "LTB₄ azalması", "TxA₂ azalması ve PGI₂ artışı", "PGF₂α azalması", "TxA₂ artışı ve PGI₂ azalması"], "a": 4, "e": "Diyabette TxA₂ artıp PGI₂ azalır; trombosit agregasyonu ve vazokonstriksiyon yönünde bozulan denge aterosklerozu hızlandırır."}, {"q": "Kansere bağlı hiperkalsemide prostaglandinlerin rolü nedir?", "o": ["PGI₂ böbrekten Ca²⁺ atılımını azaltır", "Tümör hücrelerinde artan PGE₂ kemikten Ca²⁺ rezorpsiyonunu artırır", "PGF₂α kalsitonin salgısını artırır", "LTB₄ PTH salgısını baskılar", "TxA₂ barsaktan Ca²⁺ emilimini artırır"], "a": 1, "e": "Tümör hücrelerinde PGE₂ üretimi artar; PG'ler kemikten Ca²⁺ rezorpsiyonunu artırarak hiperkalsemiye yol açar."}, {"q": "Duktus arteriozus ile ilgili hangisi doğrudur?", "o": ["Pulmoner arter ile aorta arasındadır; açık kalması PG etkinliğine bağlıdır ve sentez inhibitörleri (NSAİİ) ile kapatılabilir", "Sağ ve sol atriyum arasındadır", "Alprostadil ile kapatılır", "Doğumdan önceki 15 gün içinde kapanır", "Açık kalması TxA₂ eksikliğine bağlıdır"], "a": 0, "e": "Duktus arteriozus pulmoner arter ile aortayı birleştirir ve normalde doğumdan sonraki ~15 saatte kapanır. Açık kalması (PDA) PG etkinliğine bağlıdır; indometazin gibi sentez inhibitörleriyle kapatılır. Alprostadil (PGE₁) ise açık kalmasını sağlar."}, {"q": "Aşağıdaki prostaglandin preparatlarından hangisi terapötik abortus ve doğum indüksiyonunda kullanılır?", "o": ["Mizoprostol", "Alprostadil", "Dinoproston", "Epoprostenol", "Latanoprost"], "a": 2, "e": "Dinoproston (PGE₂), dinoprost (PGF₂α) ve karboprost obstetride terapötik abortus ve doğum indüksiyonunda kullanılır."}, {"q": "Duktus arteriozus açıklığının devamı, periferik vasküler hastalık ve impotans tedavisinde kullanılan PGE₁ preparatı hangisidir?", "o": ["Mizoprostol", "Epoprostenol", "Dinoprost", "Latanoprost", "Alprostadil"], "a": 4, "e": "Alprostadil (PGE₁) duktus arteriozusun açık tutulması, periferik vasküler hastalıklar ve impotans tedavisinde kullanılır."}, {"q": "Mide asit ve pepsin salgısını azaltan, sitoprotektif etkili ve ülser tedavisinde kullanılan PGE₁ analoğu hangisidir?", "o": ["Epoprostenol", "Latanoprost", "Dinoproston", "Karboprost", "Mizoprostol"], "a": 4, "e": "Mizoprostol, rioprostil ve enprostil PGE₁ analoglarıdır; asit ve pepsin salgısını azaltır, sitoprotektiftir ve ülserde kullanılır."}, {"q": "Diyaliz ve kalp cerrahisinde pıhtı oluşumunu engellemek için kullanılan PGI₂ preparatı hangisidir?", "o": ["Latanoprost", "Dazoksiben", "Alprostadil", "Epoprostenol sodyum", "Dinoprost"], "a": 3, "e": "Epoprostenol (PGI₂) antiagregan etkisiyle diyaliz ve kalp cerrahisinde pıhtı oluşumunu engeller; periferik vasküler hastalıklarda da kullanılır. Analogları iloprost ve sikaprosttur."}, {"q": "Lokal uygulamayla göz içi basıncını düşüren PGF₂α analoğu hangisidir?", "o": ["Mizoprostol", "Epoprostenol", "Arboprostil", "Latanoprost", "Alprostadil"], "a": 3, "e": "Latanoprost (ve travaprost, bimatoprost, unoproston) PGF₂α analoğudur; glokomda göz içi basıncını düşürür."}, {"q": "Lökotrienlerin etkileri için hangisi yanlıştır?", "o": ["Tip I alerjik reaksiyonlarda artarlar", "Kapiller permeabiliteyi azaltır ve bronşları gevşetirler", "Bronkokonstriktördürler", "Mukus yapımı ve salgılanmasını artırırlar", "Kemotaktik etki gösterirler"], "a": 1, "e": "Lökotrienler tip I alerjide artar; damar ve damar dışı düz kaslarda konstriktör, bronkokonstriktör, kemotaktiktir; kapiller permeabiliteyi artırır, hipovolemi ve kalp debisinde azalma, mukus artışı yapar."}, {"q": "Aşağıdakilerden hangisi lökotrienlerin rol oynadığı hastalıklardan biri değildir?", "o": ["Diğer kolon hastalıkları", "Psöriyazis", "Ülseratif kolit", "Duktus arteriozus açıklığı", "Bronşiyal astım"], "a": 3, "e": "Lökotrienler bronşiyal astım, psöriyazis, ülseratif kolit ve diğer kolon hastalıklarında rol oynar. Duktus arteriozus açıklığı PG etkinliğine bağlıdır."}, {"q": "Bronşiyal astım tedavisinde kullanılan lökotrien reseptör blokörü hangisidir?", "o": ["Dazoksiben", "Sildenafil", "Montelukast", "Sulfasalazin", "Epoprostenol"], "a": 2, "e": "Zafirlukast ve montelukast lökotrien reseptör blokörleridir ve bronşiyal astım tedavisinde kullanılır. Zileuton (zilotan) ve sulfasalazin ise lipoksijenaz inhibitörüdür."}, {"q": "Eikozanoid sentez inhibitörleri ve inhibe ettikleri enzimler hangisinde yanlış eşleştirilmiştir?", "o": ["Dazoksiben — lipoksijenaz inhibisyonu", "Zileuton (zilotan) — lipoksijenaz inhibisyonu", "İndometazin — siklooksijenaz inhibisyonu", "Aspirin — siklooksijenaz inhibisyonu", "Glukokortikoidler — fosfolipaz A₂ inhibisyonu"], "a": 0, "e": "Dazoksiben tromboksan sentaz inhibitörüdür. Glukokortikoidler fosfolipaz A₂'yi, NSAİİ'ler COX'u, sulfasalazin ve zileuton lipoksijenazı inhibe eder."}, {"q": "Trombosit aktive edici faktörün (PAF) kimyasal yapısı hangisidir?", "o": ["21 aminoasitli peptid", "1-alkil-2-asetilgliseril-3-fosfokolin", "20 karbonlu prostanoik asit", "β-imidazoletilamin", "5-hidroksitriptamin"], "a": 1, "e": "PAF membran fosfolipidlerinden üretilen 1-alkil-2-asetilgliseril-3-fosfokolindir. Trombositler, nötrofil-eozinofiller, monositler, endotel, mast hücreleri ve böbrek mezangial hücrelerinde üretilir."}, {"q": "PAF'ın etkileri için hangisi yanlıştır?", "o": ["Pulmoner damar yatağında güçlü vazodilatasyon yapar", "Gastrointestinal, bronş ve uterus düz kaslarını kasar; ülserojendir", "Trombosit agregasyonu ve TxA₂ üretimini artırır", "Güçlü vazodilatör olup hipotansif etki gösterir", "Kapiller ve venül permeabilitesini artırır"], "a": 0, "e": "PAF sistemik olarak güçlü vazodilatördür (hipotansif) ancak pulmoner damar yatağında vazokonstriksiyon yapar. Permeabiliteyi artırır, agregasyonu ve TxA₂'yi artırır, trombositopeni, düz kas kasılması yapar ve en güçlü ülserojen otakoiddir."}, {"q": "“En güçlü” etkiler tablosuna göre hangi eşleştirme yanlıştır?", "o": ["En güçlü antiagregan — PGI₂", "En güçlü bronkokonstriktör ve permeabilite artırıcı — LTD₄", "En güçlü kemotaktik — PGE₂", "En güçlü proinflamatuar ve hiperaljezik — PGE₂", "En güçlü ülserojen — PAF"], "a": 2, "e": "En güçlü kemotaktik ajan LTB₄'tür. Diğer eşleştirmeler doğrudur: ülserojen PAF, antiagregan PGI₂, bronkokonstriktör/permeabilite artırıcı LTD₄, proinflamatuar ve hiperaljezik PGE₂."}, {"q": "Endotelin-1 (ET-1) ile ilgili hangisi doğrudur?", "o": ["Histidinin dekarboksilasyonuyla oluşur", "Araşidonik asitten siklooksijenazla oluşan bir lipiddir", "Endopeptidazla doğrudan aktif ET-1'e dönüşür", "Proendotelinden endotelin dönüştürücü enzim (EDE-1) ile oluşan 21 aminoasitli bir peptiddir", "Yalnızca damar endotelinde sentezlenir"], "a": 3, "e": "Preproendotelin endopeptidazla proendoteline, proendotelin EDE-1 ile 21 aminoasitli ET-1'e dönüşür. ET-1 damar endoteli dışında akciğer, solunum yolları, böbrek ve barsaklarda endotel dışı hücrelerde de sentezlenir."}, {"q": "ET-1 salıverilmesinde en önemli fizyolojik faktör hangisidir?", "o": ["PGI₂ artışı", "NO artışı", "Kan şekerinin yükselmesi", "Hipotermi", "Damar duvarının gerilimi"], "a": 4, "e": "ET-1 salıverilmesinde en önemli fizyolojik faktör damar duvarının gerilimidir. Anjiyotensin, vazopresin, adrenalin, IL-1, hipoksi ve sürtünme stresi salıverilmeyi artırır; PGI₂, NO ve ANP azaltır."}, {"q": "Aşağıdakilerden hangisi ET-1 salıverilmesini azaltır?", "o": ["Atriyal natriüretik peptid (ANP)", "Damar endotelinde sürtünme stresi", "Vazopresin", "Anjiyotensin", "Hipoksi"], "a": 0, "e": "PGI₂, NO ve ANP ET-1 salıverilmesini azaltır. Anjiyotensin, vazopresin, adrenalin, IL-1, hipoksi ve sürtünme stresi ise artırır."}, {"q": "ET-1'in farmakolojik etkileri için hangisi yanlıştır?", "o": ["Renal kan akımını ve GFR'yi artırarak su ve tuz atılımını artırır", "Vazokonstriksiyonla kan basıncını artırır", "Histamin salınımına neden olan en güçlü endojen maddedir; proinflamatuar ve mitojeniktir", "TxA₂ aracılı bronkokonstriksiyon yapar", "Kalpte pozitif inotrop etki yapar"], "a": 0, "e": "ET-1 vazokonstriktördür (böbrek damar yatağı çok duyarlıdır); renal kan akımı ve GFR'yi azaltarak su-tuz retansiyonu yapar. Bronkokonstriksiyon, pozitif inotropi, mitojenik ve proinflamatuar etki gösterir; histamin salıverilmesine yol açan en güçlü endojen maddedir."}, {"q": "EDRF'nin (endotel kaynaklı gevşetici faktör) NO olduğu hangi yıl gösterilmiştir?", "o": ["1980", "1987", "1982", "1971", "1998"], "a": 1, "e": "1980'de Furchgott ve Zawadzki EDRF'yi tanımladı (1998 Nobel Tıp Ödülü); 1987'de EDRF'nin NO olduğu gösterildi."}, {"q": "Nitrik oksit (NO) ile ilgili hangisi yanlıştır?", "o": ["Eşleşmemiş bir elektrona sahip serbest radikaldir", "Hemoglobin tarafından inhibe edilir", "Yarılanma ömrü 1–5 saniyedir", "Yarılanma ömrü saatler mertebesindedir ve hemoglobin tarafından potansiyelize edilir", "SOD ile potansiyalize olur"], "a": 3, "e": "NO'nun yarılanma ömrü 1–5 saniyedir; hemoglobin tarafından inhibe edilir, süperoksit dismutaz (SOD) ile potansiyalize olur ve eşleşmemiş elektronlu bir serbest radikaldir."}, {"q": "NO'nun vasküler ve trombosit üzerindeki etkileri için hangisi yanlıştır?", "o": ["Antiproliferatif etkiyle ateroskleroz gelişimini önler", "Endotel adezyon moleküllerinin ekspresyonunu artırarak aterosklerozu hızlandırır", "İnhalasyonla verildiğinde yenidoğan pulmoner hipertansiyonunda pulmoner arter basıncını azaltır", "Damar düz kasında gevşeme yapar", "cGMP aracılığıyla trombosit agregasyon ve adezyonunu inhibe eder"], "a": 1, "e": "NO endotel yüzeyindeki adezyon moleküllerinin ekspresyonunu inhibe ederek endoteli korur; damar düz kasını gevşetir, trombüs oluşumunu engeller, antiproliferatiftir. İnhale NO pulmoner hipertansiyon ve ARDS'li yenidoğanlarda oksijenasyonu artırır."}, {"q": "Sildenafilin (Viagra) penil ereksiyon üzerindeki etki mekanizması hangisidir?", "o": ["cAMP'yi parçalayan fosfodiesteraz-3'ü uyarmak", "Siklooksijenazı inhibe etmek", "cGMP'yi parçalayan fosfodiesteraz-5'i inhibe ederek NANK sinirlerden salınan NO'nun corpus cavernosum'daki gevşetici etkisini artırmak", "NO sentazı doğrudan inhibe etmek", "Endotelin reseptörlerini uyarmak"], "a": 2, "e": "Penil ereksiyon NANK (nonadrenerjik nonkolinerjik) sinirlerden salınan NO aracılığıyla corpus cavernosum düz kasının gevşemesiyle olur. Sildenafil cGMP'yi yıkan PDE-5'i inhibe eder."}, {"q": "ANP (atriyal natriüretik peptid) ile ilgili hangisi doğrudur?", "o": ["Diüretik, natriüretik ve vazodilatör etkilidir; endopeptidazla parçalanır ve endopeptidaz inhibitörü sinorfan plazma ANP düzeyini artırır", "Vazokonstriktör ve sodyum tutucu etkilidir", "ET-1 salıverilmesini artırır", "Siklooksijenazla parçalanır", "Kan basıncının uzun süreli düzenlenmesinde rolü yoktur"], "a": 0, "e": "ANP diüretik, natriüretik ve vazodilatördür; su-elektrolit dengesi ve kan basıncının uzun süreli düzenlenmesinde önemlidir. Endopeptidazla yıkılır; endopeptidaz inhibitörü sinorfan ANP düzeyini artırarak hipertansiyonda kullanılabilir."}];
const L = ['A','B','C','D','E'];
const list = document.getElementById('list');
let ok = 0, bad = 0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  list.innerHTML = DATA.map((d,i)=>`
  <div class="q" id="q${i}">
    <div class="q-head"><span class="q-num">${i+1}.</span><span class="q-text">${esc(d.q)}</span></div>
    <div class="opts">${d.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="letter">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="exp"><b>Doğru cevap: ${L[d.a]}</b> — ${esc(d.e)}</div>
  </div>`).join('');
}
function update(){
  const done = ok + bad;
  document.getElementById('sOk').textContent = 'Doğru: ' + ok;
  document.getElementById('sBad').textContent = 'Yanlış: ' + bad;
  document.getElementById('sLeft').textContent = 'Kalan: ' + (DATA.length - done);
  document.getElementById('prog').style.width = (done / DATA.length * 100) + '%';
  const r = document.getElementById('result');
  if (done === DATA.length){
    r.innerHTML = `<h2>Test tamamlandı</h2><p>${DATA.length} sorudan <b>${ok}</b> doğru, <b>${bad}</b> yanlış · Başarı: <b>%${Math.round(ok/DATA.length*100)}</b></p>`;
    r.classList.add('show');
  } else r.classList.remove('show');
}
list.addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b || b.disabled) return;
  const qi = +b.dataset.q, oi = +b.dataset.o, d = DATA[qi];
  const card = document.getElementById('q'+qi);
  card.querySelectorAll('.opt').forEach((x,j)=>{
    x.disabled = true;
    if (j === d.a) x.classList.add('correct');
    else if (j === oi) x.classList.add('wrong');
    else x.classList.add('dim');
  });
  card.classList.add('done');
  if (oi === d.a) ok++; else bad++;
  update();
});
document.getElementById('reset').addEventListener('click', ()=>{
  ok = 0; bad = 0; render(); update(); window.scrollTo({top:0,behavior:'smooth'});
});
render(); update();
</script>
