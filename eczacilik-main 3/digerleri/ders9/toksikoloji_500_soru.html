<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toksikoloji - 500 Soruluk Test</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --card-hover: #243142;
  --border: #2d3b50;
  --text: #e6edf3;
  --text-dim: #8b98a8;
  --primary: #4a9eff;
  --primary-dark: #2d7dd2;
  --success: #2ea043;
  --success-bg: #1a3a26;
  --danger: #f85149;
  --danger-bg: #3a1a1a;
  --warning: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 0;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a2332 0%, #243142 100%);
  padding: 30px 20px;
  text-align: center;
  border-bottom: 2px solid var(--border);
}
.header h1 {
  font-size: 28px;
  margin-bottom: 8px;
  color: var(--primary);
}
.header p { color: var(--text-dim); font-size: 14px; }
.controls {
  position: sticky;
  top: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
}
.stat-item { display: flex; align-items: center; gap: 6px; }
.stat-label { color: var(--text-dim); }
.stat-value { font-weight: 600; color: var(--text); }
.stat-value.correct { color: var(--success); }
.stat-value.wrong { color: var(--danger); }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  background: var(--card-hover);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  font-weight: 500;
}
.btn:hover { background: var(--primary); border-color: var(--primary); }
.btn.danger:hover { background: var(--danger); border-color: var(--danger); }
.search-box {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  width: 200px;
}
.progress-bar {
  height: 4px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), var(--primary));
  width: 0%;
  transition: width 0.4s;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.question-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
  transition: all 0.2s;
}
.question-card:hover { border-color: var(--primary-dark); }
.question-card.answered { opacity: 0.95; }
.question-card.hidden { display: none; }
.q-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.q-number {
  background: var(--primary);
  color: white;
  min-width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.q-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  padding-top: 6px;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.option:hover:not(.locked) {
  background: var(--card-hover);
  border-color: var(--primary);
}
.option.locked { cursor: default; }
.option-letter {
  min-width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--card-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.option-text { font-size: 14px; flex: 1; }
.option.correct {
  background: var(--success-bg);
  border-color: var(--success);
}
.option.correct .option-letter {
  background: var(--success);
  color: white;
}
.option.wrong {
  background: var(--danger-bg);
  border-color: var(--danger);
}
.option.wrong .option-letter {
  background: var(--danger);
  color: white;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
@media (max-width: 600px) {
  .header h1 { font-size: 22px; }
  .controls { padding: 10px 12px; }
  .stats { font-size: 12px; gap: 10px; }
  .search-box { width: 100%; }
  .btn { padding: 6px 10px; font-size: 12px; }
  .container { padding: 12px; }
  .question-card { padding: 14px; }
  .q-text { font-size: 14px; }
  .option { padding: 10px 12px; }
  .option-text { font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🧪 Toksikoloji - 500 Soruluk Test</h1>
  <p>Şıkkın üzerine tıklayın · Doğru cevap yeşil, yanlış cevap kırmızı olarak görünecektir</p>
</div>

<div class="controls">
  <div class="stats">
    <div class="stat-item"><span class="stat-label">Cevaplandı:</span><span class="stat-value" id="answered">0</span><span class="stat-label">/ 500</span></div>
    <div class="stat-item"><span class="stat-label">Doğru:</span><span class="stat-value correct" id="correct">0</span></div>
    <div class="stat-item"><span class="stat-label">Yanlış:</span><span class="stat-value wrong" id="wrong">0</span></div>
    <div class="stat-item"><span class="stat-label">Başarı:</span><span class="stat-value" id="success">—</span></div>
  </div>
  <div class="btn-group">
    <input type="text" class="search-box" id="search" placeholder="🔍 Soru ara...">
    <button class="btn" onclick="shuffleQuestions()">🔀 Karıştır</button>
    <button class="btn danger" onclick="resetAll()">🔄 Sıfırla</button>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="container" id="quiz-container"></div>

<div class="footer">
  Toplam 500 soru · Cevaplarınız tarayıcınızda yerel olarak saklanır
</div>

<script>
const STORAGE_KEY = 'toks_answers_v1';
const QUESTIONS = [{"q": "Zehrin absorbsiyonunu engellemek amacıyla aşağıdakilerden hangisi yapılmaz?", "options": ["Kusturma", "Mide yıkama", "Bağırsak boşaltılması", "Aktif kömür uygulaması", "Hemodiyaliz"], "correct": 4}, {"q": "Aşağıdakilerden hangisi absorbsiyonu yavaşlatıcı yöntemlerdendir?", "options": ["Kusturma", "Mide yıkama", "Aktif kömür", "Bağırsak boşaltılması", "Hemoperfüzyon"], "correct": 2}, {"q": "Cilde temas eden toksik madde ile zehirlenmede ilk yapılması gereken nedir?", "options": ["Antidot uygulamak", "Bölgeyi bol su ile yıkamak", "Hastayı kusturmak", "Mide yıkamak", "Hemodiyaliz uygulamak"], "correct": 1}, {"q": "Gözden yabancı cisim uzaklaştırılırken yıkama yönü nasıl olmalıdır?", "options": ["Dışarıdan içeriye", "İçeriden dışarıya", "Aşağıdan yukarı", "Yukarıdan aşağıya", "Yıkama yönü önemli değildir"], "correct": 1}, {"q": "İnhalasyon yoluyla zehirlenmelerde ilk yapılması gereken nedir?", "options": ["Hastayı kusturmak", "Ortamı havalandırmak ve hastayı uzaklaştırmak", "Mide yıkamak", "Antidot vermek", "Aktif kömür vermek"], "correct": 1}, {"q": "Yılan ve akrep ısırmalarında ne yapılır?", "options": ["Hasta kusturulur", "Mide yıkanır", "Isırılan bölge bandajla sarılır ve buz uygulanır", "Aktif kömür verilir", "Hemoperfüzyon yapılır"], "correct": 2}, {"q": "Ağız yoluyla alınan zehirlerde yapılacak ilk işlem nedir?", "options": ["Zehirin gastrointestinal sistemden emiliminin engellenmesi", "Antidot uygulaması", "Hemodiyaliz", "Hemoperfüzyon", "Zorlu diürez"], "correct": 0}, {"q": "Kusturma ve mide yıkama için ideal süre yaklaşık kaç saattir?", "options": ["1 saat", "2 saat", "4 saat", "6 saat", "8 saat"], "correct": 1}, {"q": "Aşağıdakilerden hangisi mekanik kusturma yöntemidir?", "options": ["Sodyum klorür uygulanması", "Bakır sülfat uygulanması", "İpeka şurubu", "Parmakla farenkse dokunma", "Apomorfin"], "correct": 3}, {"q": "Kimyasal kusturmada hangi maddeler kullanılır?", "options": ["Sodyum klorür ve bakır sülfat", "Aktif kömür ve manni anılır?", "options": ["Atropin", "Metilen mavisi", "Naloksan", "BAL", "EDTA"], "correct": 1}];
let answers = {};
let displayOrder = QUESTIONS.map((_, i) => i);

function loadAnswers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) answers = JSON.parse(raw);
  } catch(e) { answers = {}; }
}

function saveAnswers() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch(e){}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const container = document.getElementById('quiz-container');
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const html = displayOrder.map((origIdx, displayIdx) => {
    const q = QUESTIONS[origIdx];
    const selected = answers[origIdx];
    const isAnswered = selected !== undefined;
    const optionsHtml = q.options.map((opt, i) => {
      let cls = 'option';
      if (isAnswered) {
        cls += ' locked';
        if (i === q.correct) cls += ' correct';
        else if (i === selected) cls += ' wrong';
      }
      return `<div class="${cls}" data-q="${origIdx}" data-opt="${i}" onclick="selectAnswer(${origIdx}, ${i})">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${escapeHtml(opt)}</div>
      </div>`;
    }).join('');
    return `<div class="question-card ${isAnswered ? 'answered' : ''}" data-q="${origIdx}" data-text="${escapeHtml(q.q.toLowerCase())}">
      <div class="q-header">
        <div class="q-number">${displayIdx + 1}</div>
        <div class="q-text">${escapeHtml(q.q)}</div>
      </div>
      <div class="options">${optionsHtml}</div>
    </div>`;
  }).join('');
  container.innerHTML = html;
  updateStats();
}

function selectAnswer(qIdx, optIdx) {
  if (answers[qIdx] !== undefined) return;
  answers[qIdx] = optIdx;
  saveAnswers();
  const card = document.querySelector(`.question-card[data-q="${qIdx}"]`);
  if (!card) return;
  const q = QUESTIONS[qIdx];
  card.classList.add('answered');
  card.querySelectorAll('.option').forEach(el => {
    const i = parseInt(el.dataset.opt);
    el.classList.add('locked');
    if (i === q.correct) el.classList.add('correct');
    else if (i === optIdx) el.classList.add('wrong');
  });
  updateStats();
}

function updateStats() {
  const total = QUESTIONS.length;
  let answered = 0, correct = 0, wrong = 0;
  for (const k in answers) {
    answered++;
    if (answers[k] === QUESTIONS[k].correct) correct++;
    else wrong++;
  }
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct').textContent = correct;
  document.getElementById('wrong').textContent = wrong;
  document.getElementById('success').textContent = answered > 0 ? Math.round(correct/answered*100) + '%' : '—';
  document.getElementById('progress').style.width = (answered/total*100) + '%';
}

function shuffleQuestions() {
  for (let i = displayOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [displayOrder[i], displayOrder[j]] = [displayOrder[j], displayOrder[i]];
  }
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetAll() {
  if (!confirm('Tüm cevaplarınız silinecek. Emin misiniz?')) return;
  answers = {};
  saveAnswers();
  displayOrder = QUESTIONS.map((_, i) => i);
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('search').addEventListener('input', function(e) {
  const term = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.question-card').forEach(card => {
    const text = card.dataset.text || '';
    card.classList.toggle('hidden', term && !text.includes(term));
  });
});

loadAnswers();
render();
</script>
